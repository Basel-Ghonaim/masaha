<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="masaha/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المساحات — مساحة</title>
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/fonts/fonts.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/styles.css">
<link rel="stylesheet" href="masaha/masaha.css">
<script src="masaha/i18n.js"></script>
<script src="_vendor/react.js"></script>
<script src="_vendor/react-dom.js"></script>
<script src="_vendor/babel.min.js"></script>
<script src="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.js"></script>
<script src="masaha/data.js"></script>
<script src="masaha/details-data.js"></script>
<script src="masaha/admin-data.js"></script>
</head>
<body class="bg-background text-foreground">
<div id="ds-root"></div>
<script type="text/babel" src="masaha/shared.jsx"></script>
<script type="text/babel" src="masaha/admin.jsx"></script>
<script type="text/babel">
const { DirectionProvider, Button, Badge, DataTable, ToggleGroup, ToggleGroupItem, EmptyState, Input, Field, Select, SelectTrigger, SelectValue, SelectContent, SelectItem, Switch, DropdownMenu, DropdownMenuTrigger, DropdownMenuContent, DropdownMenuItem, DropdownMenuSeparator, AlertDialog, AlertDialogContent, AlertDialogHeader, AlertDialogTitle, AlertDialogDescription, AlertDialogFooter, AlertDialogCancel, AlertDialogAction, Dialog, DialogContent, DialogHeader, DialogTitle, DialogDescription, DialogFooter, RadioGroup, RadioGroupItem, SearchIcon, SearchXIcon, EllipsisVerticalIcon, toast } = window.MasahaDesignSystem;
const M = window.MASAHA;
const ownerName = (id) => personName(id, AD.users);
function Spaces({ theme, setTheme }) {
  const [list, setList] = React.useState(AD.spaces);
  const [q, setQ] = React.useState(''); const [gov, setGov] = React.useState('all'); const [status, setStatus] = React.useState(AD.STATE_FILTER[pageParams.get('status')] ? pageParams.get('status') : 'all'); const [stale, setStale] = React.useState(pageParams.get('stale') === '1');
  const [del, setDel] = React.useState(pageParams.get('del') ? AD.spaces.find((s) => s.id === pageParams.get('del')) : null);
  // `?unlink=<space>&owner=<id>`: that owner of that space, the space's first when none is named.
  const [unlink, setUnlink] = React.useState(() => { const s = AD.spaces.find((x) => x.id === pageParams.get('unlink')); const o = s && (s.owners.includes(pageParams.get('owner')) ? pageParams.get('owner') : s.owners[0]); return o ? { s, o } : null; });
  const [link, setLink] = React.useState(pageParams.get('link') ? AD.spaces.find((s) => s.id === pageParams.get('link')) : null);
  const govs = M.governorates.filter((g) => !g.hidden);
  const areaOpts = govs.flatMap((g) => [['g:' + g.id, g.name], ...g.areas.map((a) => ['a:' + a.id, '— ' + a.name])]);
  // A3, as the contract's filter: verified and unverified leave hidden spaces out, hidden keeps them
  // whatever their verification, and a deleted space is listed only under «محذوفة».
  const inState = (s) => (status === 'deleted' ? !!s.deleted : !s.deleted && (status === 'all' || (status === 'hidden' ? s.hidden : !s.hidden && s.status === status)));
  const rows = list.filter((s) => (!q.trim() || s.name.toLowerCase().includes(q.trim().toLowerCase())) && (gov === 'all' || gov === 'g:' + s.gov || gov === 'a:' + s.area) && inState(s) && (!stale || AD.staleGroups(s).length || AD.missingGroups(s).length));
  const upd = (id, p) => setList((l) => l.map((x) => (x.id === id ? { ...x, ...p } : x)));
  const toggleHide = (s) => { const hidden = !s.hidden; upd(s.id, { hidden }); toast(hidden ? tr(`أُخفيت ${s.name} من الموقع`, `${s.name} hidden from the site`) : tr(`أصبحت ${s.name} ظاهرة`, `${s.name} is visible again`), { action: { label: tr('تراجع', 'Undo'), onClick: () => toggleHide({ ...s, hidden }) } }); };
  // A3: a deleted space comes back at once, as it was — hidden or not, with its owners (S1).
  const restore = (s) => { upd(s.id, { deleted: undefined }); toast.success(tr(`استُرجعت ${s.name} — عادت كما كانت`, `${s.name} restored, as it was`)); };
  const fresh = (s) => {
    if (s.deleted) return <span className="text-muted-foreground">—</span>;
    const g = AD.staleGroups(s); const m = AD.missingGroups(s);
    if (!g.length && !m.length) return <Badge variant="success">{tr('محدّثة', 'Up to date')}</Badge>;
    // DI-22: «ناقصة» is `warning` everywhere for the admin (A8), as «قديمة» is.
    return <span className="flex flex-wrap gap-2">{g.length > 0 && <Badge variant="warning"><span>{tr('قديمة:', 'Stale:')} {g.map((x) => AD.GROUP[x]).join(tr('، ', ', '))}</span></Badge>}{m.length > 0 && <Badge variant="warning"><span>{tr('ناقصة:', 'Missing:')} {m.map((x) => AD.GROUP[x]).join(tr('، ', ', '))}</span></Badge>}</span>;
  };
  const State = ({ s }) => s.deleted ? <span className="text-body-sm text-muted-foreground">{tr('محذوفة', 'Deleted')} · {AD.fmt(s.deleted)}</span> : <SpaceStatus s={s} />;
  const owners = (s) => s.owners.length ? s.owners.map(ownerName).join(tr('، ', ', ')) : <span className="text-muted-foreground">—</span>;
  const actions = (s) => s.deleted ? <Button size="sm" variant="outline" onClick={() => restore(s)} aria-label={tr('استرجاع ', 'Restore ') + s.name}>{tr('استرجاع', 'Restore')}</Button> : (
    <DropdownMenu dir={DIR}>
      <DropdownMenuTrigger asChild><Button variant="ghost" size="icon" aria-label={tr('إجراءات ', 'Actions for ') + s.name}><EllipsisVerticalIcon /></Button></DropdownMenuTrigger>
      <DropdownMenuContent align="end">
        <DropdownMenuItem asChild><a href={'Admin space edit.html?id=' + s.id}>{s.status === 'verified' ? tr('عرض (يعدّلها المالك)', 'View (the owner edits it)') : tr('تعديل', 'Edit')}</a></DropdownMenuItem>
        <DropdownMenuItem onSelect={() => toggleHide(s)}>{s.hidden ? tr('إظهار', 'Show') : tr('إخفاء', 'Hide')}</DropdownMenuItem>
        <DropdownMenuItem onSelect={() => setLink(s)}>{tr('ربط مالك', 'Link owner')}</DropdownMenuItem>
        {/* A4: one item per owner, naming the link it ends. */}
        {s.owners.map((o) => <DropdownMenuItem key={o} onSelect={() => setUnlink({ s, o })}>{tr('فك ربط ', 'Unlink ') + ownerName(o)}</DropdownMenuItem>)}
        <DropdownMenuSeparator />
        <DropdownMenuItem onSelect={() => setDel(s)}>{tr('حذف', 'Delete')}</DropdownMenuItem>
      </DropdownMenuContent>
    </DropdownMenu>
  );
  const columns = [
    { id: 'name', header: tr('المساحة', 'Space'), cell: ({ row }) => row.original.deleted ? <span lang="en" className="text-label text-muted-foreground">{row.original.name}</span> : <a lang="en" className="text-label text-foreground" href={'Admin space edit.html?id=' + row.original.id}>{row.original.name}</a> },
    { id: 'area', header: tr('المنطقة', 'Area'), cell: ({ row }) => AD.areaName(row.original) },
    { id: 'status', header: tr('الحالة', 'Status'), cell: ({ row }) => <State s={row.original} /> },
    { id: 'owners', header: tr('المالك', 'Owner'), cell: ({ row }) => owners(row.original) },
    { id: 'fresh', header: tr('الحداثة', 'Freshness'), cell: ({ row }) => fresh(row.original) },
    { id: 'last', header: tr('آخر تحديث', 'Last update'), cell: ({ row }) => AD.fmt(row.original.last) },
    { id: 'act', header: () => <span className="sr-only">{tr('إجراءات', 'Actions')}</span>, cell: ({ row }) => <div className="flex justify-end">{actions(row.original)}</div> }
  ];
  const paged = usePaged(rows);
    const addBtn = <Button asChild><a href="Admin space add.html">{tr('إضافة مساحة', 'Add space')}</a></Button>;
  return (
    <AdminShell current="spaces" title={tr('المساحات', 'Spaces')} theme={theme} setTheme={setTheme}>
      <AdminList label={tr('المساحات', 'Spaces')} columns={columns} data={paged.rows} getRowId={(r) => r.id} loading={pageParams.get('state') === 'loading'}
        summary={paged.summary} pagination={paged.nav}
        toolbar={<div className="flex flex-col gap-3">
          <div className="grid gap-3 md:grid-cols-3">
            <Field label={tr('بحث', 'Search')}><Input role="searchbox" placeholder={tr('اسم المساحة', 'Space name')} startIcon={<SearchIcon />} value={q} onChange={(e) => setQ(e.target.value)} /></Field>
            <FilterSheet count={rows.length} active={[gov !== 'all', status !== 'all'].filter(Boolean).length} onClear={() => { setGov('all'); setStatus('all'); }}>
            <Field label={tr('المحافظة / المنطقة', 'Governorate / area')}><Select value={gov} onValueChange={setGov}><SelectTrigger><SelectValue /></SelectTrigger><SelectContent><SelectItem value="all">{tr('كل المناطق', 'All areas')}</SelectItem>{areaOpts.map(([v, l]) => <SelectItem key={v} value={v}>{l}</SelectItem>)}</SelectContent></Select></Field>
            <Field label={tr('الحالة', 'Status')}><Select value={status} onValueChange={setStatus}><SelectTrigger><SelectValue /></SelectTrigger><SelectContent><SelectItem value="all">{tr('كل الحالات', 'All statuses')}</SelectItem>{Object.entries(AD.STATE_FILTER).map(([k, l]) => <SelectItem key={k} value={k}>{l}</SelectItem>)}</SelectContent></Select></Field>
            </FilterSheet>
          </div>
          <div className="flex flex-wrap items-center justify-between gap-3">
            {/* A7: a switch is not a filter field — the stale filter is a chip by the count, and (DI-26) its words
                say that it keeps the missing groups too, as the contract's `stale=true` does. */}
            <div className="flex flex-wrap items-center gap-3">
              <ResultCount>{tr('عدد المساحات', 'Spaces')}: <Num>{rows.length}</Num></ResultCount>
              <ToggleGroup type="multiple" value={stale ? ['stale'] : []} onValueChange={(v) => setStale(v.includes('stale'))} aria-label={tr('تصفية سريعة', 'Quick filter')}><ToggleGroupItem value="stale">{tr('قديمة أو ناقصة', 'Stale or missing')}</ToggleGroupItem></ToggleGroup>
            </div>
            {addBtn}
          </div>
        </div>}
        renderCard={(s) => (
          <div className="flex items-start justify-between gap-3">
            <div className="flex min-w-0 flex-col gap-1">
              {s.deleted ? <span lang="en" className="self-start text-label text-muted-foreground">{s.name}</span> : <a lang="en" className="self-start text-label text-foreground" href={'Admin space edit.html?id=' + s.id}>{s.name}</a>}
              <span className="text-caption text-muted-foreground">{AD.areaName(s)} · {tr('المالك', 'Owner')}: {owners(s)} · {AD.fmt(s.last)}</span>
              <span className="flex flex-wrap gap-2"><State s={s} />{!s.deleted && fresh(s)}</span>
            </div>
            {actions(s)}
          </div>
        )}
        empty={<EmptyState icon={<SearchXIcon />} title={tr('لا توجد مساحات تطابق الفلاتر', 'No spaces match the filters')} />} />
      <LinkOwnerDialog space={link} spaces={list} onClose={() => setLink(null)} onLinked={(uid, sid) => setList((l) => l.map((x) => (x.id === sid ? { ...x, owners: [...x.owners, uid], status: 'verified' } : x)))} />
      <AlertDialog open={!!unlink} onOpenChange={(o) => !o && setUnlink(null)}>
        <AlertDialogContent>
          <AlertDialogHeader><AlertDialogTitle>{unlink && tr(`فك ربط ${ownerName(unlink.o)} من `, `Unlink ${ownerName(unlink.o)} from `)}<span lang="en">{unlink && unlink.s.name}</span>{tr('؟', '?')}</AlertDialogTitle><AlertDialogDescription>{unlink && unlinkLine(unlink.s, unlink.s.owners, AD.users.find((u) => u.id === unlink.o))}</AlertDialogDescription></AlertDialogHeader>
          <AlertDialogFooter><AlertDialogCancel>{tr('رجوع', 'Back')}</AlertDialogCancel><AlertDialogAction variant="destructive" onClick={() => { const s = unlink.s; const left = s.owners.filter((x) => x !== unlink.o); upd(s.id, { owners: left, status: left.length ? s.status : 'unverified' }); toast(left.length ? tr('فُك الربط', 'Unlinked') : tr('فُك الربط · المساحة غير موثّقة', 'Unlinked · space unverified')); }}>{tr('فك الربط', 'Unlink')}</AlertDialogAction></AlertDialogFooter>
        </AlertDialogContent>
      </AlertDialog>
      <AlertDialog open={!!del} onOpenChange={(o) => !o && setDel(null)}>
        <AlertDialogContent>
          <AlertDialogHeader><AlertDialogTitle>{tr('حذف', 'Delete')} <span lang="en">{del && del.name}</span>؟</AlertDialogTitle><AlertDialogDescription>{tr('تختفي من الموقع ومن القائمة، وتجدها في «محذوفة» لاسترجاعها.', 'It leaves the site and the list; you’ll find it under «Deleted» to restore it.')}</AlertDialogDescription></AlertDialogHeader>
          <AlertDialogFooter><AlertDialogCancel>{tr('رجوع', 'Back')}</AlertDialogCancel><AlertDialogAction variant="destructive" onClick={() => { const s = del; upd(s.id, { deleted: AD.TODAY }); toast(tr('حُذفت المساحة', 'Space deleted'), { action: { label: tr('تراجع', 'Undo'), onClick: () => upd(s.id, { deleted: undefined }) } }); }}>{tr('حذف', 'Delete')}</AlertDialogAction></AlertDialogFooter>
        </AlertDialogContent>
      </AlertDialog>
    </AdminShell>
  );
}

function Screen() { const [theme, setTheme] = useTheme(); return <Spaces theme={theme} setTheme={setTheme} />; }
ReactDOM.createRoot(document.getElementById('ds-root')).render(<DirectionProvider dir={DIR}><Screen /></DirectionProvider>);
</script>
</body>
</html>
