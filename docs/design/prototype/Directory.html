<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="masaha/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المساحات — مساحة</title>
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/fonts/fonts.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/styles.css">
<link rel="stylesheet" href="masaha/masaha.css">
<script src="masaha/i18n.js"></script>
<script src="_vendor/react.js"></script>
<script src="_vendor/react-dom.js"></script>
<script src="_vendor/babel.min.js"></script>
<script src="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.js"></script>
<script src="masaha/data.js"></script>
</head>
<body class="bg-background text-foreground">
<div id="ds-root"></div>
<script type="text/babel" src="masaha/shared.jsx"></script>
<script type="text/babel" src="masaha/location.jsx"></script>
<script type="text/babel" src="masaha/map.jsx"></script>
<script type="text/babel">
const { DirectionProvider, Input, Button, Badge, Card, CardHeader, CardTitle, CardDescription, CardAction, CardContent, CardFooter, Alert, AlertTitle, AlertDescription, AlertAction, EmptyState, Field, Select, SelectTrigger, SelectValue, SelectContent, SelectItem, ToggleGroup, ToggleGroupItem, Switch, Sheet, SheetContent, SheetHeader, SheetTitle, SheetDescription, SheetBody, SheetFooter, SheetClose, Skeleton, Combobox, ComboboxTrigger, ComboboxContent, ComboboxGroup, ComboboxItem, SearchIcon, SearchXIcon, XIcon } = window.MasahaDesignSystem;
const M = window.MASAHA;

const list = (k) => (pageParams.get(k) || '').split(',').filter(Boolean);
const initialFilters = () => ({
  q: pageParams.get('q') || '',
  areas: list('area'),
  availableOnly: pageParams.get('available') === '1',
  verifiedOnly: pageParams.get('verified') === '1',
  period: pageParams.get('period') || 'day',
  priceMin: pageParams.get('priceMin') || '',
  priceMax: pageParams.get('priceMax') || '',
  others: pageParams.get('demo') === 'noresults' ? ['friday'] : list('other')
});
// Filters live in the URL so the space page's back link returns to the same results.
function syncUrl(f, view) {
  const p = new URLSearchParams(location.search);
  const put = (k, v) => (v ? p.set(k, v) : p.delete(k));
  put('q', f.q.trim()); put('area', f.areas.join(',')); put('available', f.availableOnly ? '1' : '');
  put('verified', f.verifiedOnly ? '1' : ''); const range = priceRange(f); put('period', range.on ? f.period : ''); put('priceMin', f.priceMin.trim()); put('priceMax', f.priceMax.trim()); put('other', f.others.join(',')); put('view', view === 'map' ? 'map' : '');
  ['sheet', 'selected', 'pick', 'gov', 'am'].forEach((k) => p.delete(k));
  const qs = p.toString() ? '?' + p.toString() : '';
  history.replaceState(null, '', location.pathname + qs);
  try { const keep = new URLSearchParams(qs); ['state', 'demo', 'loc'].forEach((k) => keep.delete(k)); sessionStorage.setItem('masaha:dir-query', keep.toString() ? '?' + keep : ''); } catch (e) {}
}
const clearedFilters = (f) => ({ ...f, q: '', areas: [], availableOnly: false, verifiedOnly: false, period: 'day', priceMin: '', priceMax: '', others: [] });
const activeCount = (f) => f.areas.length + (f.availableOnly ? 1 : 0) + (f.verifiedOnly ? 1 : 0) + (priceRange(f).on ? 1 : 0) + f.others.length;
const countLabel = (n) => n === 0 ? tr("لا توجد مساحات", "No spaces") : n === 1 ? tr("مساحة واحدة", "1 space") : n === 2 ? tr("مساحتان", "2 spaces") : LANG === 'en' ? `${n} spaces` : n <= 10 ? `${n} مساحات` : `${n} مساحة`;

// U3: the search matches both names of a space and its area's, in either language.
const matches = (s, q) => { const a = M.findArea(s.area) || {}; return [s.name, s.nameAr, a.ar, a.en].some((t) => t && t.toLowerCase().includes(q)); };

// The count says where: the Strip, or the one area chosen.
const placeLine = (ids) => ids.length === 1 ? tr(`في ${M.areaName(ids[0])}`, `in ${M.areaName(ids[0])}`) : ids.length ? tr('في المناطق المحددة', 'in the chosen areas') : tr('في قطاع غزة', 'in the Gaza Strip');

function applyFilters(f, sort, coords) {
  const q = f.q.trim().toLowerCase();
  const list = M.spaces.filter((s) =>
    (!f.areas.length || f.areas.includes(s.area)) &&
    (!f.availableOnly || (s.verified && s.status === 'open')) &&
    (!f.verifiedOnly || s.verified) &&
    inRange(s, f) &&
    f.others.every((o) => s.others.includes(o)) &&
    (!q || matches(s, q))
  ).map((s) => ({ s, km: coords ? M.distanceKm(coords, s) : null }));
  const by = {
    distance: (a, b) => a.km - b.km,
    updated: (a, b) => a.s.updatedDays - b.s.updatedDays,
    name: (a, b) => spaceName(a.s).localeCompare(spaceName(b.s), LANG)
  };
  return list.sort(by[sort] || by.updated);
}

// U1: the directory covers the Strip, and place is one filter — the areas of the public
// catalogue, each governorate a group, nothing chosen by default. A governorate with no active
// area has no group. The amenities are no filter (the owner, 2026-10-12).
const placeSummary = (ids) => ids.length === 0 ? tr("كل المناطق", "All areas") : ids.length === 1 ? M.areaName(ids[0]) : ids.length === 2 ? tr("منطقتان محددتان", "2 areas chosen") : LANG === 'en' ? `${ids.length} areas chosen` : ids.length <= 10 ? `${ids.length} مناطق محددة` : `${ids.length} منطقة محددة`;
function PlaceField({ value, onChange }) {
  return (
    <Field label={tr("المنطقة", "Area")}>
      <Combobox type="multiple" value={value} onValueChange={onChange}>
        <ComboboxTrigger empty={!value.length}>{placeSummary(value)}</ComboboxTrigger>
        <ComboboxContent searchLabel={tr("ابحث عن منطقة", "Search for an area")} searchPlaceholder={tr("اسم المنطقة", "Area name")} listLabel={tr("المناطق", "Areas")} emptyText={tr("لا توجد منطقة بهذا الاسم", "No area by that name")}>
          {M.governorates.filter((g) => !g.hidden && g.areas.length).map((g) => (
            <ComboboxGroup key={g.id} heading={g.name}>
              {g.areas.map((a) => <ComboboxItem key={a.id} value={a.id} keywords={[a.ar, a.en]}>{a.name}</ComboboxItem>)}
            </ComboboxGroup>
          ))}
        </ComboboxContent>
      </Combobox>
    </Field>
  );
}

// U5 with S1: a budget. The period says which price the range reads — it is not a filter on its
// own, so it always holds one («يوم» by default) and is sent only with a bound. A bound is a whole
// number of shekels above zero (no price is ever 0); one that is not is said on its field and not
// applied. An unverified space with stale prices shows none, so the range leaves it out.
const toLatin = (t) => t.replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim();
function priceRange(f) {
  const read = (t) => { const v = toLatin(t); return v === '' ? { v: null } : /^[1-9][0-9]*$/.test(v) ? { v: Number(v) } : { bad: true }; };
  const min = read(f.priceMin), max = read(f.priceMax);
  const order = min.v != null && max.v != null && max.v < min.v;
  const errMin = min.bad ? tr("اكتب مبلغًا أكبر من صفر", "Enter an amount above zero") : null;
  const errMax = max.bad ? tr("اكتب مبلغًا أكبر من صفر", "Enter an amount above zero") : order ? tr("أقل من الحد الأدنى", "Below the minimum") : null;
  const ok = !errMin && !errMax;
  return { min: ok ? min.v : null, max: ok ? max.v : null, on: ok && (min.v != null || max.v != null), errMin, errMax };
}
const inRange = (s, f) => {
  const r = priceRange(f);
  if (!r.on) return true;
  const v = M.priceHidden(s) ? null : s.prices[f.period];
  return v != null && (r.min == null || v >= r.min) && (r.max == null || v <= r.max);
};
function PriceField({ f, set }) {
  const r = priceRange(f);
  // The form is drawn twice below `lg` (the hidden sidebar and the sheet), so its ids are its own.
  const groupId = React.useId();
  // «50 ₪» in Arabic, «₪50» in English: the sign leads the field in both directions.
  const shekel = <span aria-hidden="true">₪</span>;
  return (
    <div role="group" aria-labelledby={groupId} className="flex flex-col gap-3">
      <p id={groupId} className="text-label">{tr("السعر", "Price")}</p>
      <ToggleGroup type="single" aria-label={tr("الفترة", "Period")} value={f.period} onValueChange={(v) => v && set({ period: v })}>
        {M.periods.map((p) => <ToggleGroupItem key={p.id} value={p.id}>{p.short}</ToggleGroupItem>)}
      </ToggleGroup>
      <div className="grid grid-cols-2 gap-3">
        <Field label={tr("من", "From")} error={r.errMin}><Input dir="ltr" inputMode="numeric" autoComplete="off" startIcon={shekel} value={f.priceMin} onChange={(e) => set({ priceMin: e.target.value })} /></Field>
        <Field label={tr("إلى", "To")} error={r.errMax}><Input dir="ltr" inputMode="numeric" autoComplete="off" startIcon={shekel} value={f.priceMax} onChange={(e) => set({ priceMax: e.target.value })} /></Field>
      </div>
      <p className="text-caption text-muted-foreground">{tr("النطاق على سعر الفترة المختارة.", "The range reads the chosen period’s price.")}</p>
    </div>
  );
}

function FiltersForm({ f, set }) {
  const spacesId = React.useId();
  return (
    <div className="flex flex-col gap-6">
      <PlaceField value={f.areas} onChange={(v) => set({ areas: v })} />
      {/* U5: the two switches are one group; an unverified space never has a live state. */}
      <div role="group" aria-labelledby={spacesId} className="flex flex-col gap-2">
        <p id={spacesId} className="text-label">{tr("المساحات", "Spaces")}</p>
        <Field label={tr("متاحة الآن فقط", "Available now only")} orientation="horizontal"><Switch checked={f.availableOnly} onCheckedChange={(v) => set({ availableOnly: v })} /></Field>
        <Field label={tr("المساحات الموثّقة فقط", "Verified spaces only")} orientation="horizontal"><Switch checked={f.verifiedOnly} onCheckedChange={(v) => set({ verifiedOnly: v })} /></Field>
        <p className="text-caption text-muted-foreground">{tr("تشمل «متاحة الآن» المساحات الموثّقة فقط.", "“Available now” covers verified spaces only.")}</p>
      </div>
      <PriceField f={f} set={set} />
      <Field label={tr("أخرى", "Other")}>
        <ToggleGroup type="multiple" value={f.others} onValueChange={(v) => set({ others: v })}>
          {M.others.map((a) => <ToggleGroupItem key={a.id} value={a.id}>{a.name}</ToggleGroupItem>)}
        </ToggleGroup>
      </Field>
    </div>
  );
}

const SORTS = () => ({ distance: tr("حسب المسافة", "By distance"), updated: tr("الأحدث تحديثًا", "Recently updated"), name: tr("حسب الاسم", "By name") });

function NoResults({ onClear }) {
  return (
    <EmptyState icon={<SearchXIcon />} title={tr("لا توجد مساحات تطابق الفلاتر", "No spaces match the filters")} description={tr("جرّب إزالة بعض الفلاتر أو البحث باسم آخر.", "Try removing some filters or searching for another name.")}>
      <Button variant="outline" onClick={onClear}>{tr("مسح الفلاتر", "Clear filters")}</Button>
    </EmptyState>
  );
}

// U6: on a phone the selected space is a small bottom sheet, not a card over half the map. It is
// not modal: the map keeps panning behind it, and tapping another pin selects that one.
function SelectedSheet({ item, onClose }) {
  const { s, km } = item;
  return (
    <Sheet open modal={false} onOpenChange={(o) => !o && onClose()}>
      <SheetContent side="bottom" closeLabel={tr("إغلاق", "Close")} onInteractOutside={(e) => e.preventDefault()} onOpenAutoFocus={(e) => e.preventDefault()}>
        <SheetHeader>
          <SheetTitle><SpaceName space={s} /></SheetTitle>
          <SheetDescription>{areaLine(s)}</SheetDescription>
        </SheetHeader>
        <SheetBody className="flex flex-col gap-2 pb-2">
          <LiveStatus space={s} />
          <SpaceMeta space={s} km={km} />
        </SheetBody>
        <SheetFooter><Button className="w-full" asChild><a href={spaceHref(s)}>{tr("عرض التفاصيل", "View details")}</a></Button></SheetFooter>
      </SheetContent>
    </Sheet>
  );
}

function CompactSpaceCard({ item, onClose }) {
  const { s, km } = item;
  return (
    <Card className="shadow-overlay">
      <CardHeader>
        <CardTitle><SpaceName space={s} /></CardTitle>
        <CardDescription>{areaLine(s)}</CardDescription>
        <CardAction><Button variant="ghost" size="icon" aria-label={tr("إغلاق", "Close")} onClick={onClose}><XIcon /></Button></CardAction>
      </CardHeader>
      <CardContent className="flex flex-col gap-2">
        <LiveStatus space={s} />
        <SpaceMeta space={s} km={km} />
      </CardContent>
      <CardFooter><Button className="w-full" asChild><a href={spaceHref(s)}>{tr("عرض التفاصيل", "View details")}</a></Button></CardFooter>
    </Card>
  );
}

function DirectoryScreen() {
  const [theme, setTheme] = useTheme();
  const isDesktop = useIsDesktop();
  const isTablet = useIsTablet();
  const near = useNearMe();
  const [state, setState] = React.useState(pageParams.get('state') || 'ready');
  const [f, setF] = React.useState(initialFilters);
  const [view, setView] = React.useState(pageParams.get('view') === 'map' || near.loc.status === 'picking' ? 'map' : 'list');
  const [sheetOpen, setSheetOpen] = React.useState(pageParams.get('sheet') === 'filters');
  const [selectedId, setSelectedId] = React.useState(pageParams.get('selected'));
  const [sort, setSort] = React.useState(near.coords ? 'distance' : 'updated');
  const set = (patch) => setF((prev) => ({ ...prev, ...patch }));

  // U2: «الأقرب إليّ» is a control of its own, not an item of the sort list. A location that
  // arrives sorts by distance; another sort leaves it, keeping the location until «مسح موقعي».
  React.useEffect(() => {
    if (near.coords) setSort('distance');
    else setSort((s) => (s === 'distance' ? 'updated' : s));
  }, [!!near.coords]);
  const sortingByDistance = sort === 'distance' && !!near.coords;
  const toggleNear = () => (sortingByDistance ? setSort('updated') : near.coords ? setSort('distance') : near.request());
  const chooseSort = (v) => setSort(v);
  const changeView = (v) => setView(v);
  const firstSync = React.useRef(true);
  React.useEffect(() => { if (firstSync.current && pageParams.get('sheet')) { firstSync.current = false; return; } firstSync.current = false; syncUrl(f, view); }, [f, view]);
  const pickOnMap = () => { changeView('map'); setSelectedId(null); near.startPick(); };
  // «اختر منطقتك»: from 1024 the list view's filters are the sidebar, so the focus goes to its
  // «المنطقة»; below it, or on the map, the sheet opens.
  const chooseArea = () => {
    const place = isDesktop && view === 'list' && document.querySelector('aside [role=combobox]');
    if (!place) return setSheetOpen(true);
    place.scrollIntoView({ behavior: 'smooth', block: 'center' });
    place.focus({ preventScroll: true });
  };

  const results = applyFilters(f, sort === 'distance' && !near.coords ? 'updated' : sort, near.coords);
  const selected = results.find((r) => r.s.id === selectedId);
  const count = activeCount(f);
  const clear = () => setF(clearedFilters);
  const retry = () => { setState('loading'); setTimeout(() => setState('ready'), 1200); };
  const ready = state === 'ready';
  const picking = near.loc.status === 'picking';
  const phoneSheet = view === 'map' && !picking && !!selected && !isTablet;

    return (
    <div className="flex min-h-dvh flex-col bg-background text-foreground">
      <SiteHeader current="directory" theme={theme} setTheme={setTheme} />
      <main className="mx-auto flex w-full max-w-7xl flex-1 flex-col gap-4 px-4 py-6 md:px-8">
        <div className="flex flex-wrap items-end justify-between gap-4">
          <div className="flex flex-col gap-1">
            <h1 className="text-heading-1">{tr("مساحات العمل", "Workspaces")}</h1>
          </div>
          {/* PU-013: two pressed states of one control, not a tab list with no panels. */}
          <Field label={<span className="sr-only">{tr("طريقة العرض", "View")}</span>}>
            <ToggleGroup type="single" value={view} onValueChange={(v) => v && changeView(v)}>
              <ToggleGroupItem value="list">{tr("قائمة", "List")}</ToggleGroupItem>
              <ToggleGroupItem value="map">{tr("خريطة", "Map")}</ToggleGroupItem>
            </ToggleGroup>
          </Field>
        </div>

        {/* On the map a phone has no sort, so the search and «الفلاتر» share one row, and the map leads. */}
        <div className={'flex gap-2 md:flex-row md:items-center ' + (view === 'map' ? 'flex-row items-center' : 'flex-col')}>
          <Input role="searchbox" aria-label={tr("ابحث عن مساحة", "Search for a space")} placeholder={tr("اسم المساحة أو المنطقة", "Space name or area")} startIcon={<SearchIcon />} className={view === 'map' ? 'min-w-0 flex-1' : 'md:flex-1'} value={f.q} onChange={(e) => set({ q: e.target.value })} />
          <div className="flex items-center gap-2">
            {/* P5: the one filter sheet. From 1024 the list view's filters are in the sidebar, so the
                            toolbar draws none; the map has no sidebar, so there the sheet stays at every width. */}
            <FilterSheet at="lg" wide={view === 'map' ? 'sheet' : 'none'} open={sheetOpen} onOpenChange={setSheetOpen} active={count} count={results.length} onClear={clear} description={tr("تُطبَّق فورًا على النتائج", "Applied to the results right away")}>
              <FiltersForm f={f} set={set} />
            </FilterSheet>
            {view === 'list' && (
              <div className="flex-1 md:w-48 md:flex-none">
                <Select value={sort} onValueChange={chooseSort}>
                  <SelectTrigger aria-label={tr("الترتيب", "Sort")}><SelectValue>{tr("الترتيب: ", "Sort: ")}{SORTS()[sort]}</SelectValue></SelectTrigger>
                  <SelectContent>
                    <SelectItem value="updated">{tr("الأحدث تحديثًا", "Recently updated")}</SelectItem>
                    <SelectItem value="name">{tr("حسب الاسم", "By name")}</SelectItem>
                  </SelectContent>
                </Select>
              </div>
            )}
          </div>
        </div>
        {/* U2 and P5: the count by the toolbar, «الأقرب إليّ» beside it in both views, its one state line under them. */}
        <div className="flex flex-wrap items-center justify-between gap-2">
          <ResultCount>{ready ? `${countLabel(results.length)} ${placeLine(f.areas)} · ${DISPLAY_ONLY()}` : '\u00a0'}</ResultCount>
          {!picking && <NearMeButton near={near} on={sortingByDistance} onToggle={toggleNear} />}
        </div>
        {!picking && <LocationStatus near={near} sorting={sortingByDistance} onStop={() => setSort('updated')} onPickOnMap={pickOnMap} onChooseArea={chooseArea} />}

        {state === 'error' && (
          <Alert variant="destructive">
            <AlertTitle>{tr("تعذّر تحميل المساحات", "Couldn’t load spaces")}</AlertTitle>
            <AlertDescription>{tr("تحقّق من اتصالك بالإنترنت ثم حاول مرة أخرى.", "Check your internet connection and try again.")}</AlertDescription>
            <AlertAction><Button variant="outline" size="sm" onClick={retry}>{tr("إعادة المحاولة", "Try again")}</Button></AlertAction>
          </Alert>
        )}

        {view === 'list' && (
          <div className="flex flex-col gap-6 lg:grid lg:grid-cols-12 lg:items-start">
            <aside className="hidden lg:col-span-3 lg:block" aria-label={tr("الفلاتر", "Filters")}>
              <Card>
                <CardHeader>
                  <CardTitle>{tr("الفلاتر", "Filters")}</CardTitle>
                  <CardAction><Button variant="ghost" size="sm" onClick={clear} disabled={count === 0}>{tr("مسح", "Clear")}</Button></CardAction>
                </CardHeader>
                <CardContent><FiltersForm f={f} set={set} /></CardContent>
              </Card>
            </aside>
            <section aria-label={tr("النتائج", "Results")} aria-busy={state === 'loading'} className="grid gap-4 md:grid-cols-2 lg:col-span-9">
              {state === 'loading' && [0, 1, 2, 3].map((i) => <SpaceCardSkeleton key={i} />)}
              {ready && (results.length
                ? results.map((r) => <SpaceCard key={r.s.id} space={r.s} km={r.km} />)
                : <Card className="md:col-span-2"><NoResults onClear={clear} /></Card>)}
            </section>
          </div>
        )}

        {view === 'map' && (
          <section aria-label={tr("الخريطة", "Map")} aria-busy={state === 'loading'} className="flex flex-col gap-3">
            {state === 'loading' ? <Skeleton className="map-canvas rounded-xl" /> : (
              <SpaceMap
                spaces={ready ? results.map((r) => r.s) : []}
                selectedId={selected && selected.s.id}
                onSelect={setSelectedId}
                user={near.coords}
                userSource={near.loc.source}
                picking={picking}
                onPick={(c) => { near.placePin(c); setSort('distance'); }}
                legend={<MapLegend />}
                focus={phoneSheet ? selected.s : null}
                focusAt={{ x: 0.5, y: 0.3 }}
                label={tr("خريطة المساحات", "Map of spaces")}
                className="map-canvas">
                {picking ? (
                  <Card className="shadow-overlay">
                    <CardHeader>
                      <CardTitle>{tr("حدّد موقعك على الخريطة", "Set your location on the map")}</CardTitle>
                      <CardDescription>{tr("اضغط على مكانك التقريبي. نحسب المسافات منه، ويبقى على جهازك فقط.", "Tap your approximate location. We measure distances from it, and it stays on your device.")}</CardDescription>
                      <CardAction><Button variant="ghost" size="sm" onClick={near.clear}>{tr("إلغاء", "Cancel")}</Button></CardAction>
                    </CardHeader>
                  </Card>
                ) : selected && isTablet ? <CompactSpaceCard item={selected} onClose={() => setSelectedId(null)} />
                  : ready && !results.length ? <Card className="shadow-overlay"><NoResults onClear={clear} /></Card> : null}
              </SpaceMap>
            )}
            {phoneSheet && <SelectedSheet item={selected} onClose={() => setSelectedId(null)} />}
          </section>
        )}
      </main>
      <SiteFooter />
      <PageToaster />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('ds-root')).render(<DirectionProvider dir={DIR}><DirectoryScreen /></DirectionProvider>);
</script>
</body>
</html>
