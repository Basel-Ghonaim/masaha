<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="masaha/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إعدادات المنصة — مساحة</title>
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/fonts/fonts.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/styles.css">
<link rel="stylesheet" href="masaha/masaha.css">
<script src="masaha/i18n.js"></script>
<script src="_vendor/react.js"></script>
<script src="_vendor/react-dom.js"></script>
<script src="_vendor/babel.min.js"></script>
<script src="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.js"></script>
<script src="masaha/data.js"></script>
<script src="masaha/details-data.js"></script>
<script src="masaha/admin-data.js"></script>
</head>
<body class="bg-background text-foreground">
<div id="ds-root"></div>
<script type="text/babel" src="masaha/shared.jsx"></script>
<script type="text/babel" src="masaha/admin.jsx"></script>
<script type="text/babel">
const { DirectionProvider, Button, Badge, Card, CardHeader, CardTitle, CardDescription, CardAction, CardContent, CardFooter, Field, Input, Switch, RadioGroup, RadioGroupItem, toast } = window.MasahaDesignSystem;
function useCard(init) { const [v, setV] = React.useState(init); const [s, setS] = React.useState(init); const dirty = JSON.stringify(v) !== JSON.stringify(s); return { v, set: (p) => setV((x) => ({ ...x, ...p })), dirty, save: () => { setS(v); toast.success(tr('حُفظت الإعدادات', 'Settings saved')); }, reset: () => setV(s) }; }
function SCard({ title, description, card, children, onSave }) {
  return (
    <Card>
      <CardHeader><CardTitle>{title}</CardTitle>{description && <CardDescription>{description}</CardDescription>}{card.dirty && <CardAction><Badge variant="warning">{tr('تغييرات غير محفوظة', 'Unsaved changes')}</Badge></CardAction>}</CardHeader>
      <CardContent className="flex flex-col gap-5">{children}</CardContent>
      <CardFooter className="flex flex-wrap gap-2"><Button disabled={!card.dirty} onClick={onSave || card.save}>{tr('حفظ', 'Save')}</Button>{card.dirty && <Button variant="ghost" onClick={card.reset}>{tr('تجاهل', 'Discard')}</Button>}</CardFooter>
    </Card>
  );
}
function PSettings({ theme, setTheme }) {
  const contact = useCard({ email: 'hello@masaha.example', whatsapp: '+970 59 000 0000' });
  const fresh = useCard({ prices: '30', other: '60' });
  const def = useCard({ autoOut: true, rounding: 'up10', cap: true });
  const [err, setErr] = React.useState({});
  const saveContact = () => { const x = {}; if (!/^\S+@\S+\.\S+$/.test(contact.v.email)) x.email = tr('أدخل بريدًا صحيحًا', 'Enter a valid email'); if (contact.v.whatsapp.replace(/\D/g, '').length < 12) x.wa = tr('رقم غير مكتمل، مثل +970 59 000 0000', 'Incomplete number, e.g. +970 59 000 0000'); setErr(x); if (!Object.keys(x).length) contact.save(); };
  const saveFresh = () => { const x = {}; if (!(Number(fresh.v.prices) > 0)) x.prices = tr('أدخل عدد الأيام', 'Enter the number of days'); if (!(Number(fresh.v.other) > 0)) x.other = tr('أدخل عدد الأيام', 'Enter the number of days'); setErr(x); if (!Object.keys(x).length) fresh.save(); };
  const RO = [['up10', tr('تقريب لأعلى بعد 10 دقائق', 'Round up after 10 minutes')], ['half', tr('لأقرب نصف ساعة', 'To the nearest half hour')], ['minute', tr('بالدقيقة', 'By the minute')]];
  return (
    <AdminShell current="settings" title={tr('إعدادات المنصة', 'Platform settings')} theme={theme} setTheme={setTheme}>
      <div className="flex max-w-2xl flex-col gap-6">
        <SCard title={tr('التواصل مع المنصة', 'Platform contact')} description={tr('يظهر في «عن مساحة» و«تواصل معنا».', 'Shown in «About Masaha» and «Contact us».')} card={contact} onSave={saveContact}>
          <Field label={tr('البريد الإلكتروني', 'Email')} error={err.email}><Input type="email" dir="ltr" value={contact.v.email} onChange={(e) => contact.set({ email: e.target.value })} /></Field>
          <Field label={tr('واتساب', 'WhatsApp')} error={err.wa}><Input type="tel" dir="ltr" placeholder="+970 59 000 0000" value={contact.v.whatsapp} onChange={(e) => contact.set({ whatsapp: e.target.value })} /></Field>
        </SCard>
        <SCard title={tr('حداثة البيانات', 'Data freshness')} description={tr('بعدها يرى الزوار «قد يكون تغيّر» أو يُخفى السعر في المساحات غير الموثّقة.', 'After this visitors see «may have changed», or the price is hidden on unverified spaces.')} card={fresh} onSave={saveFresh}>
          <div className="grid gap-4 md:grid-cols-2">
            <Field label={tr('الأسعار (أيام)', 'Prices (days)')} error={err.prices}><Input inputMode="numeric" dir="ltr" value={fresh.v.prices} onChange={(e) => fresh.set({ prices: e.target.value.replace(/\D/g, '') })} /></Field>
            <Field label={tr('باقي البيانات (أيام)', 'Other data (days)')} error={err.other}><Input inputMode="numeric" dir="ltr" value={fresh.v.other} onChange={(e) => fresh.set({ other: e.target.value.replace(/\D/g, '') })} /></Field>
          </div>
        </SCard>
        <SCard title={tr('الإعدادات الافتراضية للمساحات الجديدة', 'Defaults for new spaces')} description={tr('يغيّرها كل مالك لاحقًا من إعدادات مساحته.', 'Each owner can change them later in their space settings.')} card={def}>
          <Field label={tr('تسجيل خروج تلقائي عند الإغلاق', 'Automatic check-out at closing')} orientation="horizontal"><Switch checked={def.v.autoOut} onCheckedChange={(b) => def.set({ autoOut: b })} /></Field>
          <Field label={tr('تقريب الزيارات', 'Visit rounding')}><RadioGroup value={def.v.rounding} onValueChange={(r) => def.set({ rounding: r })}>{RO.map(([k, l]) => <Field key={k} label={l} orientation="horizontal"><RadioGroupItem value={k} /></Field>)}</RadioGroup></Field>
          <Field label={tr('لا يتجاوز سعر اليوم', 'Never more than the day price')} orientation="horizontal"><Switch checked={def.v.cap} onCheckedChange={(b) => def.set({ cap: b })} /></Field>
        </SCard>
      </div>
    </AdminShell>
  );
}

function Screen() { const [theme, setTheme] = useTheme(); return <PSettings theme={theme} setTheme={setTheme} />; }
ReactDOM.createRoot(document.getElementById('ds-root')).render(<DirectionProvider dir={DIR}><Screen /></DirectionProvider>);
</script>
</body>
</html>
