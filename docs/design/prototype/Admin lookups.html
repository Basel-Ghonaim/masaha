<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="masaha/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>القوائم — مساحة</title>
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/fonts/fonts.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/styles.css">
<link rel="stylesheet" href="masaha/masaha.css">
<script src="masaha/i18n.js"></script>
<script src="_vendor/react.js"></script>
<script src="_vendor/react-dom.js"></script>
<script src="_vendor/babel.min.js"></script>
<script src="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.js"></script>
<script src="masaha/data.js"></script>
<script src="masaha/details-data.js"></script>
<script src="masaha/admin-data.js"></script>
</head>
<body class="bg-background text-foreground">
<div id="ds-root"></div>
<script type="text/babel" src="masaha/shared.jsx"></script>
<script type="text/babel" src="masaha/admin.jsx"></script>
<script type="text/babel">
const { DirectionProvider, Button, Badge, Card, CardHeader, CardTitle, CardDescription, CardAction, CardContent, Tabs, TabsList, TabsTrigger, TabsContent, Field, Input, Switch, RadioGroup, RadioGroupItem, Sheet, SheetContent, SheetHeader, SheetTitle, SheetDescription, SheetBody, SheetFooter, ArrowUpIcon, ArrowDownIcon, toast } = window.MasahaDesignSystem;
const DS = window.MasahaDesignSystem;
// AD-027: the platform's eight amenity icons (`AMENITY_ICON_KEYS`), named as the code names them.
// The vendored bundle draws two of them; the other six are lucide's own paths (lucide-react 1.48.0,
// ISC), copied as they are so the archive draws what the web draws.
const LUCIDE = {
  wifi: ['M12 20h.01', 'M2 8.82a15 15 0 0 1 20 0', 'M5 12.859a10 10 0 0 1 14 0', 'M8.5 16.429a5 5 0 0 1 7 0'],
  zap: ['M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z'],
  'plug-zap': ['M6.3 20.3a2.4 2.4 0 0 0 3.4 0L12 18l-6-6-2.3 2.3a2.4 2.4 0 0 0 0 3.4Z', 'm2 22 3-3', 'M7.5 13.5 10 11', 'M10.5 16.5 13 14', 'm18 3-4 4h6l-4 4'],
  coffee: ['M10 2v2', 'M14 2v2', 'M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1', 'M6 2v2'],
  presentation: ['M2 3h20', 'M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3', 'm7 21 5-5 5 5'],
  'graduation-cap': ['M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z', 'M22 10v6', 'M6 12.5V16a6 3 0 0 0 12 0v-3.5']
};
const ICON_KEYS = () => [['wifi', tr('واي فاي', 'Wi-Fi')], ['zap', tr('برق', 'Lightning')], ['sun', tr('شمس', 'Sun')], ['plug-zap', tr('قابس كهرباء', 'Power plug')], ['coffee', tr('فنجان قهوة', 'Coffee cup')], ['users', tr('أشخاص', 'People')], ['presentation', tr('لوح عرض', 'Presentation board')], ['graduation-cap', tr('قبعة تخرّج', 'Graduation cap')]];
function Glyph({ name, className = 'size-4' }) {
  if (name === 'sun') return <DS.SunIcon className={className} aria-hidden="true" />;
  if (name === 'users') return <DS.UsersIcon className={className} aria-hidden="true" />;
  return <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{(LUCIDE[name] || []).map((d) => <path key={d} d={d} />)}</svg>;
}
const HiddenB = () => <Badge variant="warning">{tr('مخفية', 'Hidden')}</Badge>;
// Not `name`: Babel's `var` would be `window.name`, which the browser keeps a string.
const lname = (x) => (LANG === 'en' ? x.en : x.ar);

// AD-025: the sheet keeps the names (and an amenity's icon); the switches live in the row only.
// AD-026: a list of more than ten rows also offers its position, so a far move is one write.
function EditSheet({ item, onClose, onSave }) {
  const [v, setV] = React.useState({}); const [err, setErr] = React.useState({});
  React.useEffect(() => { if (item) { setV({ ...item.data, pos: item.pos ? String(item.pos) : '' }); setErr({}); } }, [item]);
  const set = (p) => setV((x) => ({ ...x, ...p }));
  if (!item) return <Sheet open={false}><SheetContent closeLabel="" /></Sheet>;
  const kind = item.kind;
  const long = !item.isNew && item.count > 10;
  const submit = (e) => {
    e.preventDefault(); const x = {};
    if (!(v.ar || '').trim()) x.ar = tr('أدخل الاسم بالعربية', 'Enter the Arabic name');
    if (!(v.en || '').trim()) x.en = tr('أدخل الاسم بالإنجليزية', 'Enter the English name');
    if (kind === 'amenity' && !v.icon) x.icon = tr('اختر أيقونة', 'Choose an icon');
    const pos = Number((v.pos || '').trim().replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
    if (long && !(Number.isInteger(pos) && pos >= 1 && pos <= item.count)) x.pos = tr(`من 1 إلى ${item.count}`, `From 1 to ${item.count}`);
    setErr(x);
    if (Object.keys(x).length) { setTimeout(() => { const bad = document.querySelector('[role=dialog] [aria-invalid="true"]'); if (bad) bad.focus(); }); return; }
    const { pos: _p, ...data } = v;
    onSave(item, data, long ? pos : null);
  };
  const title = { gov: tr('محافظة', 'Governorate'), area: tr('منطقة', 'Area'), amenity: tr('مرفق', 'Amenity') }[kind];
  return (
    <Sheet open onOpenChange={(o) => !o && onClose()}>
      <SheetContent side="end" closeLabel={tr('إغلاق', 'Close')}>
        <SheetHeader><SheetTitle>{item.isNew ? tr('إضافة ', 'Add ') + title : tr('تعديل ', 'Edit ') + title}</SheetTitle>{item.parent && <SheetDescription>{item.parent}</SheetDescription>}</SheetHeader>
        <form onSubmit={submit} noValidate className="flex min-h-0 flex-1 flex-col">
          <SheetBody className="flex flex-col gap-5 py-2">
            <Field label={tr('الاسم بالعربية', 'Name in Arabic')} error={err.ar}><Input lang="ar" dir="rtl" value={v.ar || ''} onChange={(e) => set({ ar: e.target.value })} /></Field>
            <Field label={tr('الاسم بالإنجليزية', 'Name in English')} error={err.en}><Input lang="en" dir="ltr" value={v.en || ''} onChange={(e) => set({ en: e.target.value })} /></Field>
            {kind === 'amenity' && (
              <Field label={tr('الأيقونة', 'Icon')} error={err.icon}>
                <RadioGroup value={v.icon || ''} onValueChange={(i) => set({ icon: i })} className="grid grid-cols-2 gap-2">
                  {ICON_KEYS().map(([k, l]) => <Field key={k} orientation="horizontal" label={<span className="flex items-center gap-2"><Glyph name={k} className="size-5" />{l}</span>}><RadioGroupItem value={k} /></Field>)}
                </RadioGroup>
              </Field>
            )}
            {long && <Field label={tr('الترتيب', 'Position')} helper={tr(`من 1 إلى ${item.count}`, `From 1 to ${item.count}`)} error={err.pos}><Input inputMode="numeric" dir="ltr" value={v.pos || ''} onChange={(e) => set({ pos: e.target.value })} /></Field>}
          </SheetBody>
          <SheetFooter><Button type="submit" className="w-full">{tr('حفظ', 'Save')}</Button></SheetFooter>
        </form>
      </SheetContent>
    </Sheet>
  );
}

// A7: the lookups never page and have no toolbar — the contract answers them whole (§4's exception).
function Lookups({ theme, setTheme }) {
  const [tab, setTabState] = React.useState(pageParams.get('tab') === 'amenities' ? 'amenities' : 'areas');
  // AD-024: two tabs with their panels; the tab stays in the address, as the code keeps it.
  const setTab = (t) => { setTabState(t); const q = new URLSearchParams(location.search); if (t === 'areas') q.delete('tab'); else q.set('tab', t); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '')); };
  const [govs, setGovs] = React.useState(AD.lookups.govs);
  const [ams, setAms] = React.useState(AD.lookups.amenities);
  const [said, setSaid] = React.useState('');
  const [edit, setEdit] = React.useState(pageParams.get('edit') === 'area' ? { kind: 'area', gov: 'gaza', parent: tr('محافظة غزة', 'Gaza City'), data: AD.lookups.govs[1].areas[10], pos: 11, count: 11 } : null);
  const moveTo = (arr, i, j) => { const a = arr.slice(); const [x] = a.splice(i, 1); a.splice(j, 0, x); return a; };
  const setGov = (id, p) => setGovs((g) => g.map((x) => (x.id === id ? { ...x, ...p } : x)));
  const setArea = (gid, aid, p) => setGovs((g) => g.map((x) => (x.id === gid ? { ...x, areas: x.areas.map((a) => (a.id === aid ? { ...a, ...p } : a)) } : x)));
  // AD-026: the moved row keeps the focus, and a polite live region says where it went.
  // P8's exception: a switch or a move shows in its row, so neither raises a toast.
  const announce = (label, j, n) => setSaid(tr(`${label}: ${j + 1} من ${n}`, `${label}: ${j + 1} of ${n}`));
  const move = (list, setList, i, d, label, focusKey) => {
    const j = i + d; setList(moveTo(list, i, j)); announce(label, j, list.length);
    setTimeout(() => { const b = document.querySelector(`[data-move="${focusKey}:${d < 0 && j === 0 ? 1 : d > 0 && j === list.length - 1 ? -1 : d}"]`); if (b) b.focus(); });
  };
  // AD-026: one rule for every list — an edit saves the names, and a list of more than ten rows
  // also takes the row to the position its sheet names.
  const place = (list, id, p) => (p ? moveTo(list, list.findIndex((x) => x.id === id), p - 1) : list);
  const save = (item, v, pos) => {
    const edit1 = (list) => place(list.map((x) => (x.id === item.data.id ? { ...x, ...v } : x)), item.data.id, pos);
    if (item.kind === 'gov') item.isNew ? setGovs((g) => [...g, { id: 'g' + Date.now(), areas: [], active: true, ...v }]) : setGovs(edit1);
    if (item.kind === 'area') item.isNew ? setGovs((g) => g.map((x) => (x.id === item.gov ? { ...x, areas: [...x.areas, { id: 'a' + Date.now(), active: true, ...v }] } : x))) : setGovs((g) => g.map((x) => (x.id === item.gov ? { ...x, areas: edit1(x.areas) } : x)));
    if (item.kind === 'amenity') item.isNew ? setAms((a) => [...a, { id: 'm' + Date.now(), active: true, ...v }]) : setAms(edit1);
    if (pos) announce(lname({ ...item.data, ...v }), pos - 1, item.count);
    setEdit(null); toast.success(tr('حُفظت القائمة', 'Lookup saved'));
  };
  // Each arrow's name carries the row's position, so a keyboard user hears where the row is.
  const Order = ({ i, n, onMove, label, id }) => (
    <span className="flex gap-1">
      <Button type="button" variant="ghost" size="icon" data-move={id + ':-1'} disabled={i === 0} aria-label={tr(`تحريك «${label}» لأعلى — ${i + 1} من ${n}`, `Move «${label}» up — ${i + 1} of ${n}`)} onClick={() => onMove(-1)}><ArrowUpIcon /></Button>
      <Button type="button" variant="ghost" size="icon" data-move={id + ':1'} disabled={i === n - 1} aria-label={tr(`تحريك «${label}» لأسفل — ${i + 1} من ${n}`, `Move «${label}» down — ${i + 1} of ${n}`)} onClick={() => onMove(1)}><ArrowDownIcon /></Button>
    </span>
  );
  return (
    <AdminShell current="lookups" title={tr('القوائم', 'Lookups')} theme={theme} setTheme={setTheme}>
      <p className="sr-only" aria-live="polite">{said}</p>
      <Tabs value={tab} onValueChange={setTab} className="flex flex-col gap-6">
        <TabsList aria-label={tr('القوائم', 'Lookups')}><TabsTrigger value="areas">{tr('المحافظات والمناطق', 'Governorates and areas')}</TabsTrigger><TabsTrigger value="amenities">{tr('المرافق', 'Amenities')}</TabsTrigger></TabsList>
        <TabsContent value="areas" className="flex max-w-4xl flex-col gap-4">
          <p className="text-body-sm text-muted-foreground">{tr('مخفية: لا تظهر في الفلاتر والنماذج. المساحات المرتبطة بها تبقى كما هي. الترتيب هنا هو ترتيب الظهور.', 'Hidden: not shown in filters and forms. Spaces already using it stay as they are. The order here is the display order.')}</p>
          {govs.map((g, gi) => (
            <Card key={g.id} className={g.active ? '' : 'bg-muted'}>
              <CardHeader>
                <CardTitle className="flex flex-wrap items-center gap-2">{lname(g)}{!g.active && <HiddenB />}</CardTitle>
                <CardDescription><span lang={LANG === 'en' ? 'ar' : 'en'}>{LANG === 'en' ? g.ar : g.en}</span> · <Num>{g.areas.length}</Num> {tr('مناطق', 'areas')}</CardDescription>
                <CardAction className="flex items-center gap-1">
                  <Order i={gi} n={govs.length} id={g.id} label={lname(g)} onMove={(d) => move(govs, setGovs, gi, d, lname(g), g.id)} />
                  <Switch checked={g.active} aria-label={tr('ظاهرة: ', 'Shown: ') + lname(g)} onCheckedChange={(on) => setGov(g.id, { active: on })} />
                  <Button size="sm" variant="ghost" onClick={() => setEdit({ kind: 'gov', data: g, pos: gi + 1, count: govs.length })}>{tr('تعديل', 'Edit')}</Button>
                </CardAction>
              </CardHeader>
              <CardContent className="flex flex-col gap-2">
                {g.areas.length > 0 && <ul className="flex flex-col divide-y rounded-lg border border-border">
                  {g.areas.map((a, ai) => (
                    <li key={a.id} className="flex flex-wrap items-center justify-between gap-2 px-3 py-2">
                      <span className="flex flex-wrap items-center gap-2"><span className="text-label">{lname(a)}</span><span lang={LANG === 'en' ? 'ar' : 'en'} className="text-caption text-muted-foreground">{LANG === 'en' ? a.ar : a.en}</span>{!a.active && <HiddenB />}</span>
                      <span className="flex items-center gap-1">
                        <Order i={ai} n={g.areas.length} id={a.id} label={lname(a)} onMove={(d) => move(g.areas, (areas) => setGov(g.id, { areas }), ai, d, lname(a), a.id)} />
                        <Switch checked={a.active} aria-label={tr('ظاهرة: ', 'Shown: ') + lname(a)} onCheckedChange={(on) => setArea(g.id, a.id, { active: on })} />
                        <Button size="sm" variant="ghost" onClick={() => setEdit({ kind: 'area', gov: g.id, parent: lname(g), data: a, pos: ai + 1, count: g.areas.length })}>{tr('تعديل', 'Edit')}</Button>
                      </span>
                    </li>
                  ))}
                </ul>}
                <Button size="sm" variant="outline" className="self-start" onClick={() => setEdit({ kind: 'area', gov: g.id, parent: lname(g), isNew: true, data: {} })}>{tr('إضافة منطقة', 'Add area')}</Button>
              </CardContent>
            </Card>
          ))}
          <Button variant="outline" className="self-start" onClick={() => setEdit({ kind: 'gov', isNew: true, data: {} })}>{tr('إضافة محافظة', 'Add governorate')}</Button>
        </TabsContent>
        <TabsContent value="amenities" className="flex max-w-4xl flex-col gap-4">
          {/* G2: no amenity is a filter, so hiding one only takes it out of the forms. */}
          <p className="text-body-sm text-muted-foreground">{tr('غير النشط لا يظهر في النماذج، وتحتفظ به المساحات التي لديها. الترتيب هنا هو ترتيب الظهور.', 'An inactive amenity is not offered in forms; spaces that have it keep it. The order here is the display order.')}</p>
          <Card>
            <CardHeader><CardTitle>{tr('المرافق', 'Amenities')}</CardTitle><CardAction><Button size="sm" onClick={() => setEdit({ kind: 'amenity', isNew: true, data: {} })}>{tr('إضافة مرفق', 'Add amenity')}</Button></CardAction></CardHeader>
            <CardContent className="p-0">
              <ul className="divide-y">
                {ams.map((m, i) => (
                  <li key={m.id} className="flex flex-col gap-2 px-5 py-3 md:flex-row md:items-center md:justify-between">
                    <span className="flex flex-wrap items-center gap-2"><Glyph name={m.icon} /><span className="text-label">{lname(m)}</span><span lang={LANG === 'en' ? 'ar' : 'en'} className="text-caption text-muted-foreground">{LANG === 'en' ? m.ar : m.en}</span>{!m.active && <HiddenB />}</span>
                    <span className="flex flex-wrap items-center gap-2">
                      <Order i={i} n={ams.length} id={m.id} label={lname(m)} onMove={(d) => move(ams, setAms, i, d, lname(m), m.id)} />
                      <Field label={tr('نشط', 'Active')} orientation="horizontal"><Switch checked={m.active} onCheckedChange={(on) => setAms((a) => a.map((x) => (x.id === m.id ? { ...x, active: on } : x)))} /></Field>
                      <Button size="sm" variant="ghost" onClick={() => setEdit({ kind: 'amenity', data: m, pos: i + 1, count: ams.length })}>{tr('تعديل', 'Edit')}</Button>
                    </span>
                  </li>
                ))}
              </ul>
            </CardContent>
          </Card>
        </TabsContent>
      </Tabs>
      <EditSheet item={edit} onClose={() => setEdit(null)} onSave={save} />
    </AdminShell>
  );
}

function Screen() { const [theme, setTheme] = useTheme(); return <Lookups theme={theme} setTheme={setTheme} />; }
ReactDOM.createRoot(document.getElementById('ds-root')).render(<DirectionProvider dir={DIR}><Screen /></DirectionProvider>);
</script>
</body>
</html>
