<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="masaha/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نسيت كلمة المرور — مساحة</title>
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/fonts/fonts.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/styles.css">
<link rel="stylesheet" href="masaha/masaha.css">
<script src="masaha/i18n.js"></script>
<script src="_vendor/react.js"></script>
<script src="_vendor/react-dom.js"></script>
<script src="_vendor/babel.min.js"></script>
<script src="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.js"></script>
<script src="masaha/data.js"></script>
</head>
<body class="bg-background text-foreground">
<div id="ds-root"></div>
<script type="text/babel" src="masaha/shared.jsx"></script>
<script type="text/babel" src="masaha/auth.jsx"></script>
<script type="text/babel">
const { DirectionProvider, Card, CardHeader, CardTitle, CardDescription, CardContent, CardFooter, Field, Input, InputAction, Button, Alert, AlertTitle, AlertDescription, AlertAction, EyeIcon, EyeOffIcon, LogInIcon, CircleCheckIcon, TriangleAlertIcon } = window.MasahaDesignSystem;
const initialState = pageParams.get('state');

const PLATFORM_WA = '+970 59 000 0099';
function useCountdown(start) {
  const [left, setLeft] = React.useState(start);
  React.useEffect(() => { if (left <= 0) return; const t = setTimeout(() => setLeft(left - 1), 1000); return () => clearTimeout(t); }, [left]);
  return [left, setLeft];
}
function ForgotScreen() {
  const [theme, setTheme] = useTheme();
  const [email, setEmail] = React.useState(initialState ? 'sara@example.com' : '');
  const [error, setError] = React.useState();
  const [loading, setLoading] = React.useState(false);
  const [sent, setSent] = React.useState(initialState === 'sent');
  const [limited, setLimited] = React.useState(initialState === 'ratelimit');
  const [left, setLeft] = useCountdown(initialState === 'sent' ? 60 : 0);

  const submit = (e) => {
    e && e.preventDefault();
    if (!email.trim()) return setError(tr("أدخل بريدك الإلكتروني", "Enter your email"));
    if (!EMAIL_RE.test(email)) return setError(tr("تحقّق من كتابة البريد الإلكتروني", "Check the email address"));
    setError(); if (limited) return;
    setLoading(true);
    // Same answer whether or not the email exists.
    setTimeout(() => { setLoading(false); setSent(true); setLeft(60); }, 1000);
  };

  return (
    <AuthShell theme={theme} setTheme={setTheme}>
      <Card className="w-full md:max-w-md">
        <CardHeader>
          <CardTitle>{sent ? tr("تفقّد بريدك الإلكتروني", "Check your email") : tr("نسيت كلمة المرور", "Forgot password")}</CardTitle>
          {!sent && <CardDescription>{tr("أدخل البريد الذي سجّلت به، وسنرسل إليه رابطًا لتعيين كلمة مرور جديدة.", "Enter the email you signed up with, and we’ll send it a link to set a new password.")}</CardDescription>}
        </CardHeader>
        <CardContent className="flex flex-col gap-4">
          {sent ? (
            <>
              <p className="text-body" role="status">{tr("إذا كان هذا البريد مسجّلًا لدينا، ستصلك رسالة فيها رابط لتعيين كلمة مرور جديدة. الرابط صالح لمدة ساعة. تفقّد مجلد الرسائل غير المرغوب فيها.", "If this email is registered with us, you’ll get a message with a link to set a new password. The link is valid for one hour. Check your spam folder.")}</p>
              <p className="text-body-sm text-muted-foreground">{tr("أُرسلت إلى ", "Sent to ")}<span dir="ltr">{email}</span></p>
              <Button variant="outline" className="w-full" disabled={left > 0} onClick={() => submit()} loading={loading}>
                {left > 0 ? <>{tr("أعد الإرسال بعد ", "Resend in ")}<span dir="ltr">{left}</span>{tr(" ثانية", " seconds")}</> : tr("أعد الإرسال", "Resend")}
              </Button>
            </>
          ) : (
            <form className="flex flex-col gap-4" noValidate onSubmit={submit}>
              {limited && <RateLimitAlert />}
              <Field label={tr("البريد الإلكتروني", "Email")} error={error}>
                <Input type="email" dir="ltr" autoComplete="email" placeholder="name@example.com" value={email} disabled={loading} onChange={(e) => setEmail(e.target.value)} />
              </Field>
              <Button type="submit" className="w-full" loading={loading}>{tr("أرسل رابط الاستعادة", "Send reset link")}</Button>
            </form>
          )}
        </CardContent>
        <CardFooter className="flex flex-col gap-2">
          <p className="text-center text-caption text-muted-foreground">{tr("لا يمكنك الوصول إلى بريدك؟ ", "Can’t access your email? ")}<a href={'https://wa.me/' + PLATFORM_WA.replace(/\D/g, '')} target="_blank" rel="noopener">{tr("تواصل معنا", "Contact us")}</a></p>
          <Button variant="link" size="sm" asChild><a href="Sign in.html">{tr("العودة إلى تسجيل الدخول", "Back to sign in")}</a></Button>
        </CardFooter>
      </Card>
    </AuthShell>
  );
}

ReactDOM.createRoot(document.getElementById('ds-root')).render(<DirectionProvider dir={DIR}><ForgotScreen /></DirectionProvider>);
</script>
</body>
</html>
