<head>

<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.css">

<script src="masaha/i18n.js"></script>

<script src="_vendor/babel.min.js"></script>
<script src="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.js"></script>

<body class="bg-background text-foreground">
<div id="ds-root"></div>
<script type="text/babel" src="masaha/shared.jsx"></script>
<script type="text/babel" src="masaha/owner.jsx"></script>
<script type="text/babel" src="masaha/map.jsx"></script>
<script type="text/babel" src="masaha/profile-a.jsx"></script>
<script type="text/babel" src="masaha/profile-b.jsx"></script>
<script type="text/babel" src="masaha/profile-c.jsx"></script>
<script type="text/babel">
const { DirectionProvider } = window.MasahaDesignSystem;
const M = window.MASAHA;
// Refactor 2: the owner's space profile — read first, each section edited in its own Sheet, the
// photos in place (G1, P2). The sample is Focus Hub; `?demo=` (owner-data.js) varies it.
const space = M.spaces.find((s) => s.id === 'focus');
const P = O.profile;
const empty = O.demo('empty');
const groups = Object.assign({}, O.groups);
O.missing.forEach((g) => { groups[g] = null; });
if (empty) ['prices', 'amenities', 'contacts'].forEach((g) => { groups[g] = null; });
const initial = pfSample({
  space, groups, limit: O.LIMIT,
  extra: { photos: P.photos, prices: P.prices.map((r, i) => Object.assign({ id: 'r' + i }, r)), hours: P.hours, shifts: P.shifts, amenities: P.amenities, own: P.own, descAr: empty ? '' : P.descAr, descEn: P.descEn, contacts: space.contacts.concat([P.other]) }
});
// G3: a visitor's open report shows inside its section (O12, A8), from «تعديل الحقل».
const AT = { hours: 'hours', prices: 'prices', amenities: 'amenities', contacts: 'contacts', location: 'location', other: 'about' };
const report = O.reports.find((x) => x.id === pageParams.get('report') && x.status === 'new');
const notice = (id) => (report && AT[report.field] === id ? <OwnerReportNotice at={reportSection(report)} /> : null);

function ProfileScreen() {
  const [theme, setTheme] = useTheme();
  return (
    <OwnerShell current="profile" title={tr('ملف المساحة', 'Space profile')} state="open" theme={theme} setTheme={setTheme}>
      <SpaceProfile initial={initial} publicHref="Space details.html?id=focus" closureHref="Announcements.html?sheet=new&type=closure" notice={notice} retired={P.retired} pkgShifts={P.pkgShifts} />
    </OwnerShell>
  );
}
ReactDOM.createRoot(document.getElementById('ds-root')).render(<DirectionProvider dir={DIR}><ProfileScreen /></DirectionProvider>);
</script>
</body>
</html>
