<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="masaha/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تعديل مساحة — مساحة</title>
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/fonts/fonts.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/styles.css">
<link rel="stylesheet" href="masaha/masaha.css">
<script src="masaha/i18n.js"></script>
<script src="_vendor/react.js"></script>
<script src="_vendor/react-dom.js"></script>
<script src="_vendor/babel.min.js"></script>
<script src="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.js"></script>
<script src="masaha/data.js"></script>
<script src="masaha/details-data.js"></script>
<script src="masaha/admin-data.js"></script>
</head>
<body class="bg-background text-foreground">
<div id="ds-root"></div>
<script type="text/babel" src="masaha/shared.jsx"></script>
<script type="text/babel" src="masaha/admin.jsx"></script>
<script type="text/babel" src="masaha/map.jsx"></script>
<script type="text/babel" src="masaha/profile-a.jsx"></script>
<script type="text/babel" src="masaha/profile-b.jsx"></script>
<script type="text/babel" src="masaha/profile-c.jsx"></script>
<script type="text/babel">
const { DirectionProvider, Badge, Alert, AlertTitle, AlertDescription, Breadcrumb, BreadcrumbList, BreadcrumbItem, BreadcrumbLink, BreadcrumbPage, BreadcrumbSeparator, AlertDialog, AlertDialogContent, AlertDialogHeader, AlertDialogTitle, AlertDialogDescription, AlertDialogFooter, AlertDialogCancel, AlertDialogAction, toast } = window.MasahaDesignSystem;
const M = window.MASAHA;
// AD-002: adding a space is a form of its own; the old address of the "new" state leads there.
const toAdd = pageParams.get('new') === '1';
if (toAdd) { const q = new URLSearchParams(location.search); q.delete('new'); location.replace('Admin space add.html' + (q.toString() ? '?' + q : '') + location.hash); }
const id = pageParams.get('id') || 'golden';
// `?id=new`: the space the creation form has just made, its profile as typed there (a sample one
// when the page is opened directly). Its four other groups are missing.
const isNew = id === 'new';
const typed = (() => { try { return JSON.parse(sessionStorage.getItem('masaha:new-space')); } catch (e) { return null; } })();
const created = typed || { nameAr: 'سكاي هب', nameEn: 'Sky Hub', descAr: '', descEn: '', area: 'rimal', addrAr: 'الرمال، شارع عمر المختار، عمارة 7', addrEn: '', landmarkAr: '', landmarkEn: '', coords: '31.52500, 34.45000' };
const meta = isNew
  ? { id: 'new', name: created.nameEn, status: 'unverified', missing: FACT_GROUPS.slice(1), upd: {}, last: AD.TODAY, owners: [] }
  : AD.spaces.find((s) => s.id === id) || AD.spaces.find((s) => s.id === 'golden');
const base = M.spaces.find((s) => s.id === meta.id) || M.spaces.find((s) => s.id === 'golden');
const readOnly = !isNew && meta.status === 'verified';
const ownerNames = (meta.owners || []).map((o) => personName(o, AD.users)).filter(Boolean).join(tr(' و', ' and '));

// Refactor 2 (G5): the owner's design. Each group's date from the sample; a group never saved has
// none, and its sections are empty. The profile is dated when the space is created.
const daysSince = (iso) => Math.round((new Date(AD.TODAY + 'T12:00:00') - new Date(iso + 'T12:00:00')) / 864e5);
const missing = (meta.missing || []).filter((g) => FACT_GROUPS.includes(g));
const groups = Object.fromEntries(FACT_GROUPS.map((g) => [g, missing.includes(g) ? null : g === 'profile' ? daysSince(meta.last) : meta.upd[g]]));
const space = isNew ? { id: 'new', photos: 0, contacts: [], amenities: [] } : Object.assign({}, base, { id: meta.id, name: meta.name, photos: (meta.missing || []).includes('photos') ? 0 : base.photos });
const profile = isNew ? created : Object.assign(sampleProfile(base), { nameAr: meta.id === base.id ? base.nameAr || '' : '', nameEn: meta.name, area: meta.area });
// `?demo=ownlimit`: 20 own amenities, the contract's limit, so «إضافة مرفق آخر» shows its reason.
const own = pageParams.get('demo') === 'ownlimit' ? Array.from({ length: 20 }, (_, i) => ({ ar: 'مرفق إضافي ' + (i + 1), en: 'Extra amenity ' + (i + 1) })) : meta.own || base.ownAmenities || [];
// `?demo=pricelimit`: 40 prices, the contract's limit, so «إضافة سعر» shows its reason.
const prices = pageParams.get('demo') === 'pricelimit' ? Array.from({ length: 40 }, (_, i) => ({ id: 'l' + i, period: ['hour', 'day', 'week', 'month'][i % 4], audience: i % 8 < 4 ? 'all' : 'students', shift: 'none', amount: String(5 + i), label: i >= 8 ? ['خيار ' + (Math.floor(i / 8) + 1), 'Option ' + (Math.floor(i / 8) + 1)] : undefined })) : undefined;
const initial = pfSample({ space, profile, groups, limit: AD.LIMIT, extra: { own, prices } });

// A8 (AD-022): `?report=<id>`, from the report's «تعديل الحقل»: the report shows inside its section,
// where the field is corrected, and is resolved there (S7).
const REPORT = (() => { const r = AD.reports.find((x) => x.id === pageParams.get('report')); return r && r.space === meta.id && r.status === 'new' && AD.handledBy(r) === 'admin' ? r : null; })();
const REPORT_SECTION = REPORT ? ({ location: 'location', other: 'about' }[REPORT.field] || REPORT.field) : null;
function ReportNotice() {
  const { Button } = window.MasahaDesignSystem;
  const [done, setDone] = React.useState(false);
  // useActionRun, not ActionButton: in-browser Babel gives every script a global `_excluded`, and a
  // later module's overwrites shared.jsx's, so ActionButton's rest props would keep `actionKey`.
  const { busy, run } = useActionRun('fix');
  React.useEffect(() => { if (location.hash === '#report') setTimeout(() => { const el = document.getElementById('report'); if (el) el.scrollIntoView({ block: 'start' }); }, 120); }, []);
  if (done) return <Alert id="report" variant="info" className="section-anchor"><AlertTitle>{tr('عُلّم «تم التصحيح»', 'Marked «Corrected»')}</AlertTitle><AlertDescription><a href="Admin reports.html?status=new">{tr('العودة إلى البلاغات', 'Back to the reports')}</a></AlertDescription></Alert>;
  return (
    <Alert id="report" variant="info" className="section-anchor">
      <AlertTitle>{tr('بلاغ مفتوح على ', 'An open report on ')}{AD.FIELD[REPORT.field]}</AlertTitle>
      <AlertDescription>
        <p>{tr('«', '“')}{REPORT.msg}{tr('»', '”')} — {REPORT.who}{tr('، ', ', ')}{AD.fmt(REPORT.date)}</p>
        <p className="flex flex-wrap items-center gap-x-4 gap-y-2 pt-2">
          <Button size="sm" loading={busy} onClick={() => run(() => setDone(true), tr('عُلّم «تم التصحيح»', 'Marked «Corrected»'))}>{tr('تم التصحيح', 'Corrected')}</Button>
          <a href={'Admin reports.html?open=' + REPORT.id}>{tr('فتح البلاغ للرد', 'Open the report to reply')}</a>
        </p>
      </AlertDescription>
    </Alert>
  );
}
const notice = (sec) => (REPORT && REPORT_SECTION === sec ? <ReportNotice /> : null);

function Edit({ theme, setTheme }) {
  const title = meta.name;
  const [hidden, setHidden] = React.useState(!!meta.hidden);
  const [del, setDel] = React.useState(false);
  // H4: the admin's own acts stay in the top bar. Hiding is reversible and touches no one, so it is
  // immediate with «تراجع» (P9); deleting asks first, and the space can be restored from the list.
  const hide = () => { const h = !hidden; setHidden(h); toast(h ? tr(`أُخفيت ${title} عن الزوار`, `${title} hidden from visitors`) : tr(`أصبحت ${title} ظاهرة للزوار`, `${title} is visible again`), { action: { label: tr('تراجع', 'Undo'), onClick: () => setHidden(!h) } }); };
  const actions = [{ key: 'hide', label: hidden ? tr('إظهار للزوار', 'Show to visitors') : tr('إخفاء عن الزوار', 'Hide from visitors'), onClick: hide }, { key: 'delete', label: tr('حذف المساحة', 'Delete the space'), onClick: () => setDel(true) }];
  return (
    <AdminShell current="spaces" title={title} theme={theme} setTheme={setTheme} actions={actions}>
      <Breadcrumb label={tr('مسار التنقل', 'Breadcrumb')}>
        <BreadcrumbList>
          <BreadcrumbItem><BreadcrumbLink href="Admin spaces.html">{tr('المساحات', 'Spaces')}</BreadcrumbLink></BreadcrumbItem>
          <BreadcrumbSeparator />
          <BreadcrumbItem><BreadcrumbPage><span lang="en">{title}</span></BreadcrumbPage></BreadcrumbItem>
        </BreadcrumbList>
      </Breadcrumb>
      {readOnly ? (
        <Alert variant="info">
          <AlertTitle>{tr('يعدّلها ', 'Edited by ')}<a href={'Admin owners.html' + (meta.owners.length === 1 ? '?q=' + encodeURIComponent(AD.users.find((u) => u.id === meta.owners[0]).email) : '')}>{ownerNames}</a></AlertTitle>
          <AlertDescription>
            <p>{tr('هذه مساحة موثّقة، فتظهر هنا للقراءة فقط. لتصحيح معلومة:', 'This space is verified, so it shows here read-only. To correct something:')}</p>
            <p className="flex flex-wrap gap-x-4 gap-y-1">
              <a href={'Admin reports.html?space=' + meta.id}>{tr('بلاغات ', 'Reports on ')}<span lang="en">{meta.name}</span></a>
              {/* A4: unlinking names the owner, one link per owner. */}
              {(meta.owners || []).map((o) => <a key={o} href={'Admin spaces.html?unlink=' + meta.id + '&owner=' + o}>{tr('فك ربط ', 'Unlink ') + personName(o, AD.users)}</a>)}
            </p>
          </AlertDescription>
        </Alert>
      ) : (
        <Alert variant="warning"><AlertTitle>{tr('أنت تعدّل مساحة غير موثّقة', 'You’re editing an unverified space')}</AlertTitle><AlertDescription>{tr('يظهر للزوار أن فريق مساحة جمع هذه المعلومات.', 'Visitors see that the Masaha team collected this information.')}</AlertDescription></Alert>
      )}
      <SpaceProfile initial={initial} readOnly={readOnly} admin={{ verified: meta.status === 'verified', hidden }} publicHref={'Space details.html?id=' + (isNew ? 'golden' : base.id)} notice={notice} manage="Admin lookups.html?tab=amenities" after={<PrivacyNote />} />
      <AlertDialog open={del} onOpenChange={setDel}>
        <AlertDialogContent>
          <AlertDialogHeader>
            <AlertDialogTitle>{tr('حذف ', 'Delete ')}<span lang="en">{title}</span>{tr('؟', '?')}</AlertDialogTitle>
            <AlertDialogDescription>{tr('تختفي من الموقع ومن لوحة مالكها. تستطيع استرجاعها من المساحات المحذوفة.', 'It leaves the site and its owner’s dashboard. You can restore it from the deleted spaces.')}</AlertDialogDescription>
          </AlertDialogHeader>
          <AlertDialogFooter>
            <AlertDialogCancel>{tr('رجوع', 'Back')}</AlertDialogCancel>
            <AlertDialogAction variant="destructive" onClick={() => { location.href = carryParams('Admin spaces.html?status=deleted'); }}>{tr('حذف', 'Delete')}</AlertDialogAction>
          </AlertDialogFooter>
        </AlertDialogContent>
      </AlertDialog>
    </AdminShell>
  );
}
function Screen() { const [theme, setTheme] = useTheme(); return <Edit theme={theme} setTheme={setTheme} />; }
if (!toAdd) ReactDOM.createRoot(document.getElementById('ds-root')).render(<DirectionProvider dir={DIR}><Screen /></DirectionProvider>);
</script>
</body>
</html>
