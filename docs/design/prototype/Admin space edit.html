<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="masaha/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تعديل مساحة — مساحة</title>
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/fonts/fonts.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/styles.css">
<link rel="stylesheet" href="masaha/masaha.css">
<script src="masaha/i18n.js"></script>
<script src="_vendor/react.js"></script>
<script src="_vendor/react-dom.js"></script>
<script src="_vendor/babel.min.js"></script>
<script src="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.js"></script>
<script src="masaha/data.js"></script>
<script src="masaha/details-data.js"></script>
<script src="masaha/admin-data.js"></script>
</head>
<body class="bg-background text-foreground">
<div id="ds-root"></div>
<script type="text/babel" src="masaha/shared.jsx"></script>
<script type="text/babel" src="masaha/admin.jsx"></script>
<script type="text/babel" src="masaha/map.jsx"></script>
<script type="text/babel" src="masaha/profile-a.jsx"></script>
<script type="text/babel" src="masaha/profile-b.jsx"></script>
<script type="text/babel">
const { DirectionProvider, Card, CardHeader, CardContent, Badge, Alert, AlertTitle, AlertDescription, Breadcrumb, BreadcrumbList, BreadcrumbItem, BreadcrumbLink, BreadcrumbPage, BreadcrumbSeparator, Separator } = window.MasahaDesignSystem;
const M = window.MASAHA;
// AD-002: adding a space is a form of its own; the old address of the "new" state leads there.
const toAdd = pageParams.get('new') === '1';
if (toAdd) { const q = new URLSearchParams(location.search); q.delete('new'); location.replace('Admin space add.html' + (q.toString() ? '?' + q : '') + location.hash); }
const id = pageParams.get('id') || 'golden';
// `?id=new`: the space the creation form has just made, its profile as typed there (a sample one
// when the page is opened directly). Its four other groups are missing.
const isNew = id === 'new';
const typed = (() => { try { return JSON.parse(sessionStorage.getItem('masaha:new-space')); } catch (e) { return null; } })();
const created = typed || { nameAr: 'سكاي هب', nameEn: 'Sky Hub', descAr: '', descEn: '', area: 'rimal', addrAr: 'الرمال، شارع عمر المختار، عمارة 7', addrEn: '', landmarkAr: '', landmarkEn: '', coords: '31.52500, 34.45000' };
const meta = isNew
  ? { id: 'new', name: created.nameEn, status: 'unverified', missing: FACT_GROUPS.slice(1), upd: {}, last: AD.TODAY, owners: [] }
  : AD.spaces.find((s) => s.id === id) || AD.spaces.find((s) => s.id === 'golden');
const base = M.spaces.find((s) => s.id === id) || M.spaces.find((s) => s.id === 'golden');
const space = isNew
  ? { id: 'new', name: created.nameEn, nameAr: created.nameAr, profile: created, contacts: [], amenities: [] }
  : { ...base, name: meta.name, nameAr: base.nameAr || '', contacts: base.contacts || [], amenities: base.amenities || [], ownAmenities: meta.own || [] };
// `?demo=ownlimit`: 20 own amenities, the contract's limit, so «إضافة مرفق إضافي» shows its reason.
if (pageParams.get('demo') === 'ownlimit') space.ownAmenities = Array.from({ length: 20 }, (_, i) => ({ ar: 'مرفق إضافي ' + (i + 1), en: 'Extra amenity ' + (i + 1) }));
const readOnly = !isNew && meta.status === 'verified';
const ownerNames = (meta.owners || []).map((o) => personName(o, AD.users)).filter(Boolean).join(tr(' و', ' and '));
// A1: one name per section, in the cards and in the navigation alike.
const SECTIONS = () => [['profile', tr('المساحة', 'The space')], ['hours', tr('ساعات العمل', 'Opening hours')], ['prices', tr('الأسعار', 'Prices')], ['amenities', tr('المرافق', 'Amenities')], ['contacts', tr('التواصل', 'Contacts')], ['photos', tr('الصور', 'Photos')]];

// Each group's date, and whether it was ever saved, from the sample data (`missing` also lists
// the pin and the photos, which are no fact group). The profile is dated when the space is created.
const daysSince = (iso) => Math.round((new Date(AD.TODAY + 'T12:00:00') - new Date(iso + 'T12:00:00')) / 864e5);
const missingGroups = (meta.missing || []).filter((g) => FACT_GROUPS.includes(g));
const groupMeta = (g) => {
  if (missingGroups.includes(g)) return { missing: true };
  const days = g === 'profile' ? daysSince(meta.last) : meta.upd[g];
  // DI-14: older than its threshold — 30 days for the prices, 60 for the others (the platform's).
  return { days, updated: ago(days), stale: days > (g === 'prices' ? AD.LIMIT.prices : AD.LIMIT.other) };
};

// Verified space: values as text, nothing editable — the same sections under the same names.
const CT = Object.fromEntries(CONTACT_TYPES());
const ContactValue = ({ c }) => { const type = OLD_TYPE[c.type] || c.type; const stored = storedForm(type, c.value) || c.value; const carrier = type === 'phone' ? carrierOf(stored) : null; return <span className="flex flex-wrap items-center gap-2"><Ltr>{stored}</Ltr>{carrier && <Badge variant="neutral">{carrier}</Badge>}</span>; };
function RO({ id, title, children }) {
  return <Card id={id} className="section-anchor"><CardHeader><SectionTitle>{title}</SectionTitle></CardHeader><CardContent className="flex flex-col gap-4">{children}</CardContent></Card>;
}
const Rows = ({ children }) => <dl className="flex flex-col divide-y">{children}</dl>;
const Row = ({ k, children }) => <div className="grid gap-1 py-2 md:grid-cols-3"><dt className="text-body-sm text-muted-foreground">{k}</dt><dd className="text-body md:col-span-2">{children || <span className="text-muted-foreground">—</span>}</dd></div>;
const Block = ({ id, title, children }) => <section id={id} aria-labelledby={id + '-title'} className="section-anchor flex flex-col gap-2"><h3 id={id + '-title'} className="text-label">{title}</h3><Rows>{children}</Rows></section>;
function ReadOnlyView() {
  const s = base; const P = s.prices || {}; const p = sampleProfile(s);
  const per = [['hour', tr('ساعة', 'Hour')], ['day', tr('يوم', 'Day')], ['week', tr('أسبوع', 'Week')], ['month', tr('شهر', 'Month')]];
  const money = (n) => (LANG === 'en' ? '₪' + n : n + ' ₪');
  const amen = (M.allAmenities || []).filter((a) => (s.amenities || []).includes(a.id)).map((a) => a.name).join(tr('، ', ', '));
  return (
    <div className="flex min-w-0 flex-col gap-6 lg:col-span-9">
      <RO id="profile" title={tr('المساحة', 'The space')}>
        <Block id="basics" title={tr('الأساسيات', 'Basics')}><Row k={tr('الاسم بالعربية', 'Name in Arabic')}>{s.nameAr}</Row><Row k={tr('الاسم بالإنجليزية', 'Name in English')}><span lang="en">{s.name}</span></Row><Row k={tr('الوصف', 'Description')}>{s.about}</Row></Block>
        <Separator />
        <Block id="location" title={tr('الموقع', 'Location')}><Row k={tr('المنطقة', 'Area')}>{AD.areaName(meta)} · {M.govName ? M.govName(s.gov) : ''}</Row><Row k={tr('العنوان', 'Address')}>{s.address}</Row><Row k={tr('علامة مميزة', 'Landmark')}>{tr(p.landmarkAr, p.landmarkEn)}</Row><Row k={tr('الإحداثيات', 'Coordinates')}><Ltr>{s.lat}, {s.lng}</Ltr></Row></Block>
      </RO>
      <RO id="hours" title={tr('ساعات العمل', 'Opening hours')}>
        <Rows>{(M.weekOrder || []).map(([k, n]) => <Row key={k} k={n}>{s.hours && s.hours[k] ? <Ltr>{s.hours[k][0]} – {s.hours[k][1]}</Ltr> : tr('مغلق', 'Closed')}</Row>)}</Rows>
        <Block id="shifts" title={tr('الورديات', 'Shifts')}>{SAMPLE_SHIFTS().map((x) => <Row key={x.id} k={tr(x.ar, x.en || x.ar)}><Ltr>{x.from} – {x.to}</Ltr></Row>)}</Block>
      </RO>
      <RO id="prices" title={tr('الأسعار', 'Prices')}><Rows>{per.map(([k, l]) => <Row key={k} k={l}>{P[k] ? <Ltr>{money(P[k])}</Ltr> : null}</Row>)}{s.studentMonth && <Row k={tr('شهر · طلاب', 'Student month')}><Ltr>{money(s.studentMonth)}</Ltr></Row>}</Rows></RO>
      <RO id="amenities" title={tr('المرافق', 'Amenities')}><Rows><Row k={tr('المتوفر', 'Available')}>{amen}</Row><Row k={tr('مرافق إضافية', 'Extra amenities')}>{(meta.own || []).map((o) => tr(o.ar, o.en || o.ar)).join(tr('، ', ', '))}</Row></Rows></RO>
      <RO id="contacts" title={tr('التواصل', 'Contacts')}><Rows>{(s.contacts || []).map((c, i) => <Row key={i} k={CT[OLD_TYPE[c.type] || c.type]}><ContactValue c={c} /></Row>)}</Rows></RO>
      <RO id="photos" title={tr('الصور', 'Photos')}><Rows><Row k={tr('العدد', 'Count')}><Ltr>{s.photos != null ? s.photos : 0}</Ltr></Row></Rows></RO>
      <PrivacyNote />
    </div>
  );
}

function Edit({ theme, setTheme }) {
  const title = space.name;
  return (
    <AdminShell current="spaces" title={title} theme={theme} setTheme={setTheme}>
      <Breadcrumb label={tr('مسار التنقل', 'Breadcrumb')}>
        <BreadcrumbList>
          <BreadcrumbItem><BreadcrumbLink href="Admin spaces.html">{tr('المساحات', 'Spaces')}</BreadcrumbLink></BreadcrumbItem>
          <BreadcrumbSeparator />
          <BreadcrumbItem><BreadcrumbPage><span lang="en">{title}</span></BreadcrumbPage></BreadcrumbItem>
        </BreadcrumbList>
      </Breadcrumb>
      <div className="flex flex-wrap items-center gap-3"><SpaceStatus s={meta} /></div>
      {readOnly ? (
        <Alert variant="info">
          <AlertTitle>{tr('يعدّلها ', 'Edited by ')}<a href={'Admin owners.html' + (meta.owners.length === 1 ? '?q=' + encodeURIComponent(AD.users.find((u) => u.id === meta.owners[0]).email) : '')}>{ownerNames}</a></AlertTitle>
          <AlertDescription>
            <p>{tr('هذه مساحة موثّقة، فتظهر هنا للقراءة فقط. لتصحيح معلومة:', 'This space is verified, so it shows here read-only. To correct something:')}</p>
            <p className="flex flex-wrap gap-x-4 gap-y-1">
              <a href={'Admin reports.html?space=' + meta.id}>{tr('بلاغات ', 'Reports on ')}<span lang="en">{meta.name}</span></a>
              {/* A4: unlinking names the owner, one link per owner. */}
              {(meta.owners || []).map((o) => <a key={o} href={'Admin spaces.html?unlink=' + meta.id + '&owner=' + o}>{tr('فك ربط ', 'Unlink ') + personName(o, AD.users)}</a>)}
              <a href={'Space details.html?id=' + meta.id}>{tr('عرض في الموقع', 'View on the site')}</a>
            </p>
          </AlertDescription>
        </Alert>
      ) : (
        <Alert variant="warning"><AlertTitle>{tr('أنت تعدّل مساحة غير موثّقة', 'You’re editing an unverified space')}</AlertTitle><AlertDescription>{tr('يظهر للزوار أن فريق مساحة جمع هذه المعلومات. كل قسم يُحفظ وحده.', 'Visitors see that the Masaha team collected this information. Each section saves on its own.')}</AlertDescription></Alert>
      )}
      <div className="flex flex-col gap-6 lg:grid lg:grid-cols-12 lg:items-start lg:gap-8">
        <SectionNav sections={SECTIONS()} wideOnly={readOnly} />
        {readOnly ? <ReadOnlyView /> : <div className="flex min-w-0 flex-col gap-6 lg:col-span-9">
          <MissingChecklist names={Object.fromEntries(SECTIONS())} missing={missingGroups} />
          <SpaceSection space={space} meta={groupMeta('profile')} />
          <HoursSection meta={groupMeta('hours')} />
          <PricesSection space={space} meta={groupMeta('prices')} />
          <AmenitiesSection space={space} meta={groupMeta('amenities')} manage="Admin lookups.html?tab=amenities" />
          <ContactsSection space={space} meta={groupMeta('contacts')} />
          <PhotosSection empty={isNew} />
          <PrivacyNote />
        </div>}
      </div>
    </AdminShell>
  );
}
function Screen() { const [theme, setTheme] = useTheme(); return <Edit theme={theme} setTheme={setTheme} />; }
if (!toAdd) ReactDOM.createRoot(document.getElementById('ds-root')).render(<DirectionProvider dir={DIR}><Screen /></DirectionProvider>);
</script>
</body>
</html>
