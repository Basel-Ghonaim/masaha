<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="masaha/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الإعلانات — مساحة</title>
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/fonts/fonts.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/styles.css">
<link rel="stylesheet" href="masaha/masaha.css">
<script src="masaha/i18n.js"></script>
<script src="_vendor/react.js"></script>
<script src="_vendor/react-dom.js"></script>
<script src="_vendor/babel.min.js"></script>
<script src="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.js"></script>
<script src="masaha/data.js"></script>
<script src="masaha/details-data.js"></script>
<script src="masaha/owner-data.js"></script>
</head>
<body class="bg-background text-foreground">
<div id="ds-root"></div>
<script type="text/babel" src="masaha/shared.jsx"></script>
<script type="text/babel" src="masaha/owner.jsx"></script>
<script src="masaha/desk-data.js"></script>
<script type="text/babel" src="masaha/desk-core.jsx"></script>
<script type="text/babel" src="masaha/desk-sheet.jsx"></script>
<script type="text/babel">
const { DirectionProvider, Button, Badge, Card, CardHeader, CardTitle, CardDescription, CardAction, CardContent, CardFooter, Tabs, TabsList, TabsTrigger, EmptyState, Field, Input, Textarea, RadioGroup, RadioGroupItem, ToggleGroup, ToggleGroupItem, Select, SelectTrigger, SelectValue, SelectContent, SelectItem, Sheet, SheetContent, SheetHeader, SheetTitle, SheetDescription, SheetBody, SheetFooter, Alert, AlertTitle, AlertDescription, AlertDialog, AlertDialogContent, AlertDialogHeader, AlertDialogTitle, AlertDialogDescription, AlertDialogFooter, AlertDialogCancel, AlertDialogAction, CircleAlertIcon, TriangleAlertIcon, CircleCheckIcon, toast } = window.MasahaDesignSystem;
// OW-014: one quiet colour; attention (warning) only for an outage and a closure. Each type says what it does.
const TYPES = () => ({
  general: [tr('عام', 'General'), 'neutral', tr('خبر أو تنبيه للزوار', 'News or a note for visitors')],
  outage: [tr('انقطاع كهرباء أو إنترنت', 'Power or internet outage'), 'warning', tr('يبقى المكان مفتوحًا، ويُنبَّه الزوار', 'The space stays open; visitors are warned')],
  closure: [tr('إغلاق مؤقت', 'Temporary closure'), 'warning', tr('تظهر المساحة «مغلق الآن» طوال الفترة', 'The space shows «Closed now» for the whole period')],
  offer: [tr('عرض', 'Offer'), 'neutral', tr('سعر أو خدمة لفترة محدودة', 'A price or a service for a limited time')],
  event: [tr('فعالية', 'Event'), 'neutral', tr('ورشة أو لقاء في المساحة', 'A workshop or a meetup at the space')]
});
const textOf = (a) => (LANG === 'en' && a.textEn ? a.textEn : a.textAr);
const STAT = () => ({ active: [tr('نشط', 'Active'), 'success'], scheduled: [tr('مجدول', 'Scheduled'), 'info'], ended: [tr('انتهى', 'Ended'), 'neutral'] });
const affected = DESK.customers.filter((c) => { const s = DESK.currentSub(c); return s && DESK.subStatus(s) !== 'expired'; }).length;

// How it looks on the public space page.
function Preview({ a }) {
  const t = textOf(a) || tr('نص الإعلان', 'Announcement text');
  return (
    <div className="flex flex-col gap-3 rounded-lg border border-border bg-background p-4">
      <span className="text-caption text-muted-foreground">{tr('معاينة — صفحة المساحة العامة', 'Preview — public space page')}</span>
      {a.type === 'closure' ? <>
        <Alert variant="warning"><AlertTitle>{t}</AlertTitle></Alert>
        <div className="flex flex-wrap items-center gap-2"><span lang="en" className="text-heading-3">Focus Hub</span><Badge variant="neutral">{tr('مغلق الآن', 'Closed now')}</Badge></div>
        <p className="text-caption text-muted-foreground">{tr('تظهر الحالة «مغلق الآن» خلال', 'The state shows «Closed now» during')} {annPeriod(a)}.</p>
      </> : (
        <div className="flex flex-col gap-1">
          <span className="text-heading-3">{tr('الإعلانات', 'Announcements')}</span>
          <div className="flex flex-col gap-1 border-t border-border pt-2">
            <span className="flex flex-wrap items-center gap-2"><Badge variant={TYPES()[a.type][1]}>{TYPES()[a.type][0]}</Badge></span>
            {LANG === 'en' && !a.textEn ? <span lang="ar" dir="rtl" className="text-body-sm">{t}</span> : <p className="text-body-sm">{t}</p>}
            <span className="text-caption text-muted-foreground">{annPeriod(a)}</span>
          </div>
        </div>
      )}
    </div>
  );
}

function AnnSheet({ item, onClose, onSave }) {
  const blank = { type: 'general', textAr: '', textEn: '', startMode: 'now', startDate: DESK.TODAY, startTime: DESK.NOW, endMode: 'at', endDate: DESK.TODAY, endTime: DESK.CLOSE };
  const [v, setV] = React.useState(blank);
  const [err, setErr] = React.useState({});
  const form = React.useRef(null);
  const { busy, run } = useActionRun('save');
  React.useEffect(() => {
    if (item) {
      if (item.id) {
        const [sd, st] = item.from.split('T');
        const [ed, et] = item.to ? item.to.split('T') : [DESK.TODAY, DESK.CLOSE];
        setV({ type: item.type, textAr: item.textAr, textEn: item.textEn || '', startMode: 'at', startDate: sd, startTime: st, endMode: item.to ? 'at' : 'none', endDate: ed, endTime: et });
      } else {
        setV({ ...blank, type: item.type || 'general' });
      }
      setErr({});
    }
  }, [item]);
  const set = (p) => setV((x) => ({ ...x, ...p }));
  const start = v.startMode === 'now' ? O.NOW_ISO : v.startDate + 'T' + v.startTime;
  const end = v.endDate + 'T' + v.endTime;
  const submit = (e) => {
    e.preventDefault();
    const x = {};
    if (!v.textAr.trim()) x.textAr = tr('أدخل نص الإعلان بالعربية', 'Enter the Arabic text');
    if (v.endMode === 'at' && !(end > start)) x.endTime = tr('النهاية بعد البداية', 'The end comes after the start');
    setErr(x);
    if (Object.keys(x).length) { setTimeout(() => { const bad = form.current && form.current.querySelector('[aria-invalid="true"]'); if (bad) bad.focus(); }); return; }
    run(() => onSave({ ...(item.id ? { id: item.id, extended: item.extended } : {}), type: v.type, textAr: v.textAr.trim(), textEn: v.textEn.trim(), from: start, to: v.endMode === 'none' ? null : end }));
  };
  return (
    <Sheet open={!!item} onOpenChange={(o) => !o && onClose()}>
      <SheetContent side="end" closeLabel={tr('إغلاق', 'Close')}>
        <SheetHeader><SheetTitle>{item && item.id ? tr('تعديل الإعلان', 'Edit announcement') : tr('إعلان جديد', 'New announcement')}</SheetTitle><SheetDescription>{tr('يظهر في صفحة المساحة العامة خلال الفترة.', 'Shown on the public space page during the period.')}</SheetDescription></SheetHeader>
        <form ref={form} onSubmit={submit} noValidate className="flex min-h-0 flex-1 flex-col">
          <SheetBody className="flex min-w-0 flex-col gap-5 py-2">
            <RateLimitNote />
            <ActionAlert for="save" />
            <Field label={tr('النوع', 'Type')}>
              <RadioGroup value={v.type} onValueChange={(t) => set({ type: t })}>
                {Object.entries(TYPES()).map(([k, [l, , h]]) => <Field key={k} orientation="horizontal" label={<span className="flex flex-col"><span>{l}</span><span className="text-caption text-muted-foreground">{h}</span></span>}><RadioGroupItem value={k} /></Field>)}
              </RadioGroup>
            </Field>
            <Field label={tr('نص الإعلان بالعربية', 'Text in Arabic')} error={err.textAr} helper={tr('جملة أو جملتان يقرؤها الزائر في صفحة المساحة.', 'A sentence or two that visitors read on the space page.')}><Textarea lang="ar" dir="rtl" rows={3} value={v.textAr} onChange={(e) => set({ textAr: e.target.value })} /></Field>
            <Field label={tr('نص الإعلان بالإنجليزية', 'Text in English')} labelEnd={<span className="text-caption text-muted-foreground">{tr('اختياري', 'Optional')}</span>} helper={tr('يظهر في الواجهة الإنجليزية؛ بدونه يظهر النص العربي.', 'Shown in the English interface; without it the Arabic text shows.')}><Textarea lang="en" dir="ltr" rows={3} value={v.textEn} onChange={(e) => set({ textEn: e.target.value })} /></Field>
            <Field label={tr('يبدأ', 'Starts')}>
              <ToggleGroup type="single" value={v.startMode} onValueChange={(m) => m && set({ startMode: m })}>
                <ToggleGroupItem value="now">{tr('الآن', 'Now')}</ToggleGroupItem>
                <ToggleGroupItem value="at">{tr('في موعد', 'At a time')}</ToggleGroupItem>
              </ToggleGroup>
            </Field>
            {v.startMode === 'at' && <div className="grid gap-3 md:grid-cols-2"><DateField label={tr('التاريخ', 'Date')} value={v.startDate} onChange={(x) => set({ startDate: x })} /><Field label={tr('الساعة', 'Time')}><TimeInput value={v.startTime} onChange={(x) => set({ startTime: x })} /></Field></div>}
            <Field label={tr('ينتهي', 'Ends')} helper={v.endMode === 'none' ? tr('يبقى حتى تنهيه.', 'It stays until you end it.') : undefined}>
              <ToggleGroup type="single" value={v.endMode} onValueChange={(m) => m && set({ endMode: m })}>
                <ToggleGroupItem value="at">{tr('في موعد', 'At a time')}</ToggleGroupItem>
                <ToggleGroupItem value="none">{tr('بلا موعد', 'No end')}</ToggleGroupItem>
              </ToggleGroup>
            </Field>
            {v.endMode === 'at' && <div className="grid gap-3 md:grid-cols-2"><DateField label={tr('التاريخ', 'Date')} value={v.endDate} onChange={(x) => set({ endDate: x })} /><Field label={tr('الساعة', 'Time')} error={err.endTime}><TimeInput value={v.endTime} onChange={(x) => set({ endTime: x })} /></Field></div>}
            {v.type === 'closure' && <Alert variant="warning"><AlertDescription>{tr('تظهر المساحة «مغلق الآن» للزوار طوال هذه الفترة.', 'Visitors see the space as «Closed now» for this whole period.')}</AlertDescription></Alert>}
            <Preview a={{ type: v.type, textAr: v.textAr, textEn: v.textEn, from: start, to: v.endMode === 'none' ? null : end }} />
          </SheetBody>
          <SheetFooter><Button type="submit" className="w-full" loading={busy}>{item && item.id ? tr('حفظ', 'Save') : tr('نشر الإعلان', 'Publish')}</Button></SheetFooter>
        </form>
      </SheetContent>
    </Sheet>
  );
}

function AnnInner({ theme, setTheme }) {
  const [list, setList] = React.useState(pageParams.get('state') === 'empty' ? [] : O.announcements.map((a) => ({ ...a })));
  const [tab, setTab] = React.useState(pageParams.get('tab') || 'active');
  const [edit, setEdit] = React.useState(pageParams.get('edit') ? O.announcements.find((a) => a.id === pageParams.get('edit')) : pageParams.get('sheet') === 'new' ? { type: pageParams.get('type') || 'general' } : null);
  const [removing, setRemoving] = React.useState(pageParams.get('delete') ? O.announcements.find((x) => x.id === pageParams.get('delete')) : null);
  const shown = list.filter((a) => annStatus(a) === tab);
  const save = (v) => { setList((l) => (v.id ? l.map((x) => (x.id === v.id ? v : x)) : [{ ...v, id: 'a' + Date.now() }, ...l])); setEdit(null); toast.success(v.id ? tr('حُفظ الإعلان', 'Announcement saved') : tr('نُشر الإعلان', 'Announcement published')); };
  const count = (s) => list.filter((a) => annStatus(a) === s).length;
  const { busy: ending, run: runEnd } = useActionRun('end');
  // O10: «إنهاء الآن» sets the end to now and acts at once; «تراجع» puts the old end back.
  const endNow = (a) => runEnd(() => {
    const was = a.to;
    setList((l) => l.map((x) => (x.id === a.id ? { ...x, to: O.NOW_ISO } : x)));
    toast.success(a.type === 'closure' ? tr('انتهى الإغلاق · عادت الحالة تلقائية', 'The closure has ended · the state is automatic again') : tr('انتهى الإعلان', 'The announcement has ended'),
      { action: { label: tr('تراجع', 'Undo'), onClick: () => setList((l) => l.map((x) => (x.id === a.id ? { ...x, to: was } : x))) } });
  });
  // P6: the ended tab is the one that grows without bound, so this list pages too.
    const paged = usePaged(shown);
    const newBtn = <Button onClick={() => setEdit({ type: 'general' })}>{tr('إعلان جديد', 'New announcement')}</Button>;
  return (
    <OwnerShell current="announcements" title={tr('الإعلانات', 'Announcements')} state={publicState(DESK.present.length, DESK.capacity)} theme={theme} setTheme={setTheme}>
      <div className="flex flex-wrap items-center justify-between gap-3">
        <Tabs value={tab} onValueChange={setTab}>
          <TabsList aria-label={tr('حالة الإعلان', 'Announcement status')}>
            <TabsTrigger value="active">{tr('نشطة', 'Active')}<Badge variant="neutral"><Num>{count('active')}</Num></Badge></TabsTrigger>
            <TabsTrigger value="scheduled">{tr('مجدولة', 'Scheduled')}<Badge variant="neutral"><Num>{count('scheduled')}</Num></Badge></TabsTrigger>
            <TabsTrigger value="ended">{tr('منتهية', 'Ended')}<Badge variant="neutral"><Num>{count('ended')}</Num></Badge></TabsTrigger>
          </TabsList>
        </Tabs>
        <div>{newBtn}</div>
      </div>
      {shown.length ? (
        <div className="flex max-w-4xl flex-col gap-4">
          {paged.rows.map((a) => { const [tl, tv] = TYPES()[a.type]; const [sl, sv] = STAT()[annStatus(a)]; const st = annStatus(a); return (
            <Card key={a.id}>
              <CardHeader>
                <CardTitle className="flex flex-wrap items-center gap-2"><Badge variant={tv}>{tl}</Badge><span className="text-body-sm text-muted-foreground">{annPeriod(a)}</span></CardTitle>
                <CardAction><Badge variant={sv}>{sl}</Badge></CardAction>
              </CardHeader>
              <CardContent className="flex flex-col gap-2">
                <p className="text-body" lang={LANG === 'en' && !a.textEn ? 'ar' : undefined} dir={LANG === 'en' && !a.textEn ? 'rtl' : undefined}>{textOf(a)}</p>
              </CardContent>
              <CardFooter className="flex flex-wrap gap-2">
                <Button size="sm" variant="outline" onClick={() => setEdit(a)}>{st === 'ended' ? tr('عرض', 'View') : tr('تعديل', 'Edit')}</Button>
                {st === 'active' && <Button size="sm" variant="outline" onClick={() => endNow(a)} loading={ending}>{tr('إنهاء الآن', 'End now')}</Button>}
                {st === 'scheduled' && <Button size="sm" variant="outline" onClick={() => setRemoving(a)}>{tr('حذف', 'Delete')}</Button>}
              </CardFooter>
            </Card>
          ); })}
              <div className="flex flex-wrap items-center justify-between gap-3">
                <ResultCount>{paged.summary}</ResultCount>
                {paged.nav}
              </div>
            </div>
          ) : <Card><EmptyState icon={<CircleAlertIcon />} title={tab === 'active' ? tr('لا توجد إعلانات نشطة', 'No active announcements') : tab === 'scheduled' ? tr('لا توجد إعلانات مجدولة', 'No scheduled announcements') : tr('لا توجد إعلانات منتهية', 'No ended announcements')} description={tr('أعلن عن إغلاق، أو انقطاع، أو عرض، أو فعالية ليراه الزوار في صفحة المساحة.', 'Announce a closure, outage, offer or event for visitors to see on the space page.')}>{newBtn}</EmptyState></Card>}
      <AnnSheet item={edit} onClose={() => setEdit(null)} onSave={save} />
      <AlertDialog open={!!removing} onOpenChange={(o) => !o && setRemoving(null)}>
        <AlertDialogContent>
          <AlertDialogHeader><AlertDialogTitle>{tr('حذف الإعلان؟', 'Delete the announcement?')}</AlertDialogTitle><AlertDialogDescription>{tr('يُحذف قبل أن يظهر للزوار، ولا يمكن استرجاعه.', 'It is deleted before visitors see it, and cannot be brought back.')}</AlertDialogDescription></AlertDialogHeader>
          <AlertDialogFooter><AlertDialogCancel>{tr('رجوع', 'Back')}</AlertDialogCancel><AlertDialogAction variant="destructive" onClick={() => { setList((l) => l.filter((x) => x.id !== removing.id)); toast.success(tr('حُذف الإعلان', 'Announcement deleted')); }}>{tr('حذف', 'Delete')}</AlertDialogAction></AlertDialogFooter>
        </AlertDialogContent>
      </AlertDialog>
    </OwnerShell>
  );
}
function Screen() { const [theme, setTheme] = useTheme(); return <DeskProvider><AnnInner theme={theme} setTheme={setTheme} /></DeskProvider>; }
ReactDOM.createRoot(document.getElementById('ds-root')).render(<DirectionProvider dir={DIR}><Screen /></DirectionProvider>);
</script>
</body>
</html>
