<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="masaha/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الإعدادات — مساحة</title>
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/fonts/fonts.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/styles.css">
<link rel="stylesheet" href="masaha/masaha.css">
<script src="masaha/i18n.js"></script>
<script src="_vendor/react.js"></script>
<script src="_vendor/react-dom.js"></script>
<script src="_vendor/babel.min.js"></script>
<script src="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.js"></script>
<script src="masaha/data.js"></script>
<script src="masaha/details-data.js"></script>
</head>
<body class="bg-background text-foreground">
<div id="ds-root"></div>
<script type="text/babel" src="masaha/shared.jsx"></script>
<script type="text/babel" src="masaha/account.jsx"></script>
<script type="text/babel" src="masaha/auth.jsx"></script>
<script type="text/babel">
const { DirectionProvider, Button, Card, CardHeader, CardTitle, CardDescription, CardContent, CardFooter, Field, Input, ToggleGroup, ToggleGroupItem, Alert, AlertDescription, Badge, Separator, toast } = window.MasahaDesignSystem;
const demo = pageParams.get('state');

function ProfileCard({ user }) {
  const [name, setName] = React.useState(user.name);
  const [error, setError] = React.useState();
  const [loading, setLoading] = React.useState(false);
  const save = (e) => {
    e.preventDefault();
    if (!name.trim()) return setError(tr('أدخل اسمك', 'Enter your name'));
    setError(); setLoading(true);
    setTimeout(() => { setLoading(false); setUser({ ...user, name: name.trim() }); toast.success(tr('حُفظت التغييرات', 'Changes saved')); }, 800);
  };
  return (
    <Card>
      <CardHeader><CardTitle>{tr('الملف الشخصي', 'Profile')}</CardTitle></CardHeader>
      <form onSubmit={save} noValidate className="flex flex-col gap-(--card-padding)">
        <CardContent className="flex flex-col gap-4">
          <Field label={tr('الاسم', 'Name')} error={error}><Input autoComplete="name" value={name} disabled={loading} onChange={(e) => setName(e.target.value)} /></Field>
          <Field label={tr('البريد الإلكتروني', 'Email')} helper={<>{tr('لتغيير البريد', 'To change your email,')} <a href="About.html#contact">{tr('تواصل معنا', 'contact us')}</a></>}>
            <Input type="email" dir="ltr" value={user.email} readOnly className="bg-muted" />
          </Field>
        </CardContent>
        <CardFooter><Button type="submit" loading={loading}>{tr('حفظ', 'Save')}</Button></CardFooter>
      </form>
    </Card>
  );
}

function PreferencesCard({ theme, setTheme }) {
  const [mode, setMode] = React.useState(pageParams.get('theme') === 'dark' ? 'dark' : 'light');
  const apply = (v) => {
    if (!v) return;
    setMode(v);
    const t = v === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : v;
    setTheme(t);
  };
  return (
    <Card>
      <CardHeader>
        <CardTitle>{tr('التفضيلات', 'Preferences')}</CardTitle>
        <CardDescription>{tr('تُطبَّق فورًا.', 'Applied right away.')}</CardDescription>
      </CardHeader>
      <CardContent className="flex flex-col gap-6">
        <Field label={tr('اللغة', 'Language')}>
          <ToggleGroup type="single" value={LANG} onValueChange={(v) => v && v !== LANG && switchLang()}>
            <ToggleGroupItem value="ar" lang="ar">العربية</ToggleGroupItem>
            <ToggleGroupItem value="en" lang="en">English</ToggleGroupItem>
          </ToggleGroup>
        </Field>
        <Field label={tr('المظهر', 'Theme')}>
          <ToggleGroup type="single" value={mode} onValueChange={apply}>
            <ToggleGroupItem value="light">{tr('فاتح', 'Light')}</ToggleGroupItem>
            <ToggleGroupItem value="dark">{tr('داكن', 'Dark')}</ToggleGroupItem>
            <ToggleGroupItem value="system">{tr('حسب الجهاز', 'Device setting')}</ToggleGroupItem>
          </ToggleGroup>
        </Field>
      </CardContent>
    </Card>
  );
}

function PasswordForm({ onDone, onBack }) {
  const [cur, setCur] = React.useState(demo === 'wrongpw' || demo === 'ratelimit' ? 'oldpass1' : '');
  const [pw, setPw] = React.useState(demo === 'wrongpw' || demo === 'ratelimit' ? 'masaha2026' : '');
  const [errors, setErrors] = React.useState(demo === 'wrongpw' ? { cur: tr('كلمة المرور الحالية غير صحيحة', 'The current password is wrong') } : {});
  const left = useRetryAfter(demo === 'ratelimit');
  const [submitted, setSubmitted] = React.useState(false);
  const [loading, setLoading] = React.useState(false);
  React.useEffect(() => { const el = document.querySelector('#pw-form input'); if (el) el.focus(); }, []);
  const submit = (e) => {
    e.preventDefault(); setSubmitted(true);
    const next = {};
    if (!cur) next.cur = tr('أدخل كلمة المرور الحالية', 'Enter your current password');
    if (!pw) next.pw = tr('أدخل كلمة المرور الجديدة', 'Enter the new password');
    else if (!passwordOk(pw)) next.pw = tr('كلمة المرور لا تستوفي الشروط أدناه', 'The password doesn’t meet the rules below');
    setErrors(next);
    if (Object.keys(next).length || left > 0) return;
    setLoading(true);
    // Demo: current password "wrong…" fails.
    setTimeout(() => { setLoading(false); if (cur.startsWith('wrong')) return setErrors({ cur: tr('كلمة المرور الحالية غير صحيحة', 'The current password is wrong') }); onDone(); }, 900);
  };
  return (
    <form id="pw-form" onSubmit={submit} noValidate className="flex flex-col gap-4">
      <RateLimitAlert left={left} />
      <PasswordField label={tr('كلمة المرور الحالية', 'Current password')} value={cur} onChange={setCur} error={errors.cur} disabled={loading} autoComplete="current-password" rules={false} />
      <PasswordField label={tr('كلمة المرور الجديدة', 'New password')} value={pw} onChange={setPw} error={errors.pw} disabled={loading} submitted={submitted} />
      <p className="text-caption text-muted-foreground">{tr("تغيير كلمة المرور يسجّل خروجك من كل الأجهزة الأخرى", "Changing your password signs you out on all your other devices")}</p>
      <div className="flex flex-wrap gap-2">
        <Button type="submit" loading={loading} disabled={left > 0}>{tr("حفظ كلمة المرور", "Save password")}</Button>
        <Button type="button" variant="ghost" onClick={onBack}>{tr("رجوع", "Back")}</Button>
      </div>
    </form>
  );
}

function MethodRow({ label, caption, end }) {
  return (
    <div className="flex flex-wrap items-center justify-between gap-2">
      <div className="flex flex-col gap-1">
        <span className="text-label">{label}</span>
        <span className="text-body-sm text-muted-foreground">{caption}</span>
      </div>
      {end}
    </div>
  );
}

function SetPasswordByEmail({ user }) {
  const [sent, setSent] = React.useState(demo === 'linksent');
  const limit = useRetryAfter(demo === 'ratelimit');
  const [left, setLeft] = useCountdown(demo === 'linksent' ? 60 : 0);
  const send = useActionRun('setlink');
  const ask = () => send.run(() => { setSent(true); setLeft(60); });
  if (sent) {
    return <LinkSent message={tr("أرسلنا إلى بريدك رابطًا لتعيين كلمة المرور. الرابط صالح لمدة ساعة. تفقّد مجلد الرسائل غير المرغوب فيها.", "We sent a link to set your password to your email. The link is valid for one hour. Check your spam folder.")} email={user.email} left={left} onResend={ask} resending={send.busy} fullWidth={false} />;
  }
  return (
    <div className="flex flex-col gap-2">
      <RateLimitAlert left={limit} />
      <p className="text-body-sm text-muted-foreground">{tr("لتسجيل الدخول بالبريد وكلمة مرور أيضًا، نرسل رابطًا إلى بريدك", "To also sign in with your email and a password, we send a link to your email")}</p>
      <Button variant="outline" className="self-start" loading={send.busy} disabled={limit > 0} onClick={ask}>{tr("أرسل رابط تعيين كلمة المرور", "Send a link to set a password")}</Button>
    </div>
  );
}

function SignInCard({ user }) {
  const hasPassword = user.method !== 'google';
  const hasGoogle = user.method !== 'email';
  const [open, setOpen] = React.useState(hasPassword && (pageParams.get('pw') === 'open' || demo === 'wrongpw' || demo === 'ratelimit'));
  const focusChange = () => setTimeout(() => { const b = document.getElementById('pw-change'); if (b) b.focus(); }, 0);
  return (
    <Card>
      <CardHeader>
        <CardTitle>{tr('تسجيل الدخول', 'Signing in')}</CardTitle>
        <CardDescription>{tr('الطرق التي تدخل بها إلى حسابك.', 'The ways you sign in to your account.')}</CardDescription>
      </CardHeader>
      <CardContent className="flex flex-col gap-4">
        {hasGoogle && <MethodRow label="Google" caption={<>{tr('تسجّل الدخول باستخدام Google', 'You sign in with Google')} · <Ltr>{user.email}</Ltr></>} end={<Badge variant="success">{tr('مربوط', 'Linked')}</Badge>} />}
        {hasGoogle && <Separator />}
        <MethodRow label={tr('كلمة المرور', 'Password')}
          caption={hasPassword ? tr('تسجّل الدخول ببريدك وكلمة المرور', 'You sign in with your email and password') : tr('لم تُعيَّن بعد', 'Not set yet')}
          end={hasPassword && !open && <Button id="pw-change" variant="outline" size="sm" aria-expanded={false} aria-controls="pw-form" onClick={() => setOpen(true)}>{tr('تغيير', 'Change')}</Button>} />
        {hasPassword && open && <PasswordForm onBack={() => { setOpen(false); focusChange(); }} onDone={() => { setOpen(false); toast.success(tr('تم تغيير كلمة المرور، وسُجّل خروجك من الأجهزة الأخرى', 'Password changed, and you were signed out on your other devices')); focusChange(); }} />}
        {!hasPassword && <SetPasswordByEmail user={user} />}
      </CardContent>
    </Card>
  );
}

function SettingsScreen() {
  const [theme, setTheme] = useTheme();
  const user = getUser();
  return (
    <AccountShell current="settings" title={tr('الإعدادات', 'Settings')} theme={theme} setTheme={setTheme}>
      {user && (
        <div className="flex max-w-2xl flex-col gap-6">
          <ProfileCard user={user} />
          <PreferencesCard theme={theme} setTheme={setTheme} />
          <SignInCard user={user} />
        </div>
      )}
    </AccountShell>
  );
}
ReactDOM.createRoot(document.getElementById('ds-root')).render(<DirectionProvider dir={DIR}><SettingsScreen /></DirectionProvider>);
</script>
</body>
</html>
