<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="masaha/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الإعدادات — مساحة</title>
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/fonts/fonts.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/styles.css">
<link rel="stylesheet" href="masaha/masaha.css">
<script src="masaha/i18n.js"></script>
<script src="_vendor/react.js"></script>
<script src="_vendor/react-dom.js"></script>
<script src="_vendor/babel.min.js"></script>
<script src="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.js"></script>
<script src="masaha/data.js"></script>
<script src="masaha/details-data.js"></script>
</head>
<body class="bg-background text-foreground">
<div id="ds-root"></div>
<script type="text/babel" src="masaha/shared.jsx"></script>
<script type="text/babel" src="masaha/account.jsx"></script>
<script type="text/babel" src="masaha/auth.jsx"></script>
<script type="text/babel">
const { DirectionProvider, Button, Card, CardHeader, CardTitle, CardDescription, CardContent, CardFooter, Field, Input, ToggleGroup, ToggleGroupItem, Alert, AlertDescription, AlertDialog, AlertDialogTrigger, AlertDialogContent, AlertDialogHeader, AlertDialogTitle, AlertDialogDescription, AlertDialogFooter, AlertDialogCancel, AlertDialogAction, Badge, toast } = window.MasahaDesignSystem;
const demo = pageParams.get('state');

function ProfileCard({ user }) {
  const [name, setName] = React.useState(user.name);
  const [error, setError] = React.useState();
  const [loading, setLoading] = React.useState(false);
  const save = (e) => {
    e.preventDefault();
    if (!name.trim()) return setError(tr('أدخل اسمك', 'Enter your name'));
    setError(); setLoading(true);
    setTimeout(() => { setLoading(false); setUser({ ...user, name: name.trim() }); toast.success(tr('حُفظت التغييرات', 'Changes saved')); }, 800);
  };
  return (
    <Card>
      <CardHeader><CardTitle>{tr('الملف الشخصي', 'Profile')}</CardTitle></CardHeader>
      <form onSubmit={save} noValidate>
        <CardContent className="flex flex-col gap-4">
          <Field label={tr('الاسم', 'Name')} error={error}><Input autoComplete="name" value={name} disabled={loading} onChange={(e) => setName(e.target.value)} /></Field>
          <Field label={tr('البريد الإلكتروني', 'Email')} helper={<>{tr('لتغيير البريد', 'To change your email,')} <a href="About.html#owners">{tr('تواصل معنا', 'contact us')}</a></>}>
            <Input type="email" dir="ltr" value={user.email} readOnly className="bg-muted" />
          </Field>
        </CardContent>
        <CardFooter><Button type="submit" loading={loading}>{tr('حفظ', 'Save')}</Button></CardFooter>
      </form>
    </Card>
  );
}

function PreferencesCard({ theme, setTheme }) {
  const [mode, setMode] = React.useState(pageParams.get('theme') === 'dark' ? 'dark' : 'light');
  const apply = (v) => {
    if (!v) return;
    setMode(v);
    const t = v === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : v;
    setTheme(t);
  };
  return (
    <Card>
      <CardHeader>
        <CardTitle>{tr('التفضيلات', 'Preferences')}</CardTitle>
        <CardDescription>{tr('تُطبَّق فورًا.', 'Applied right away.')}</CardDescription>
      </CardHeader>
      <CardContent className="flex flex-col gap-6">
        <Field label={tr('اللغة', 'Language')}>
          <ToggleGroup type="single" value={LANG} onValueChange={(v) => v && v !== LANG && switchLang()}>
            <ToggleGroupItem value="ar" lang="ar">العربية</ToggleGroupItem>
            <ToggleGroupItem value="en" lang="en">English</ToggleGroupItem>
          </ToggleGroup>
        </Field>
        <Field label={tr('المظهر', 'Theme')}>
          <ToggleGroup type="single" value={mode} onValueChange={apply}>
            <ToggleGroupItem value="light">{tr('فاتح', 'Light')}</ToggleGroupItem>
            <ToggleGroupItem value="dark">{tr('داكن', 'Dark')}</ToggleGroupItem>
            <ToggleGroupItem value="system">{tr('حسب الجهاز', 'Device setting')}</ToggleGroupItem>
          </ToggleGroup>
        </Field>
      </CardContent>
    </Card>
  );
}

function PasswordForm({ withCurrent, submitLabel, onDone, onCancel }) {
  const [cur, setCur] = React.useState(demo === 'wrongpw' || demo === 'ratelimit' ? 'oldpass1' : '');
  const [pw, setPw] = React.useState(demo === 'wrongpw' || demo === 'ratelimit' ? 'masaha2026' : '');
  const [errors, setErrors] = React.useState(demo === 'wrongpw' ? { cur: tr('كلمة المرور الحالية غير صحيحة', 'The current password is wrong') } : {});
  const [limited] = React.useState(demo === 'ratelimit');
  const [submitted, setSubmitted] = React.useState(false);
  const [loading, setLoading] = React.useState(false);
  const submit = (e) => {
    e.preventDefault(); setSubmitted(true);
    const next = {};
    if (withCurrent && !cur) next.cur = tr('أدخل كلمة المرور الحالية', 'Enter your current password');
    if (!pw) next.pw = tr('أدخل كلمة المرور الجديدة', 'Enter the new password');
    else if (!passwordOk(pw)) next.pw = tr('كلمة المرور لا تستوفي الشروط أدناه', 'The password doesn’t meet the rules below');
    setErrors(next);
    if (Object.keys(next).length || limited) return;
    setLoading(true);
    // Demo: current password "wrong…" fails.
    setTimeout(() => { setLoading(false); if (cur.startsWith('wrong')) return setErrors({ cur: tr('كلمة المرور الحالية غير صحيحة', 'The current password is wrong') }); onDone(); }, 900);
  };
  return (
    <form onSubmit={submit} noValidate className="flex flex-col gap-4">
      {limited && <RateLimitAlert />}
      {withCurrent && <PasswordField label={tr('كلمة المرور الحالية', 'Current password')} value={cur} onChange={setCur} error={errors.cur} disabled={loading} autoComplete="current-password" rules={false} />}
      <PasswordField label={tr('كلمة المرور الجديدة', 'New password')} value={pw} onChange={setPw} error={errors.pw} disabled={loading} submitted={submitted} />
      <div className="flex flex-wrap gap-2">
        <Button type="submit" loading={loading}>{submitLabel}</Button>
        {onCancel && <Button type="button" variant="ghost" onClick={onCancel}>{tr('إلغاء', 'Cancel')}</Button>}
      </div>
    </form>
  );
}

function SecurityCard({ user }) {
  const hasPassword = user.method !== 'google';
  const hasGoogle = user.method !== 'email';
  const [adding, setAdding] = React.useState(false);
  const [added, setAdded] = React.useState(false);
  return (
    <Card>
      <CardHeader><CardTitle>{tr('الأمان', 'Security')}</CardTitle></CardHeader>
      <CardContent className="flex flex-col gap-6">
        {hasGoogle && (
          <div className="flex flex-wrap items-center justify-between gap-2">
            <div className="flex flex-col gap-1">
              <span className="text-label">Google</span>
              <span className="text-body-sm text-muted-foreground">{tr('تسجّل الدخول باستخدام Google', 'You sign in with Google')} · <span dir="ltr">{user.email}</span></span>
            </div>
            <Badge variant="success">{tr('مربوط', 'Linked')}</Badge>
          </div>
        )}
        {(hasPassword || added) ? (
          <section aria-labelledby="pw-title" className="flex flex-col gap-4">
            <h3 id="pw-title" className="text-heading-3">{tr('تغيير كلمة المرور', 'Change password')}</h3>
            <PasswordForm withCurrent submitLabel={tr('حفظ كلمة المرور', 'Save password')} onDone={() => toast.success(tr('تم تغيير كلمة المرور', 'Password changed'))} />
          </section>
        ) : adding ? (
          <section aria-labelledby="pw-add" className="flex flex-col gap-4">
            <h3 id="pw-add" className="text-heading-3">{tr('إضافة كلمة مرور', 'Add a password')}</h3>
            <p className="text-body-sm text-muted-foreground">{tr('لتسجيل الدخول بالبريد الإلكتروني أيضًا.', 'So you can also sign in with your email.')}</p>
            <PasswordForm submitLabel={tr('إضافة كلمة المرور', 'Add password')} onCancel={() => setAdding(false)} onDone={() => { setAdded(true); toast.success(tr('أُضيفت كلمة المرور', 'Password added')); }} />
          </section>
        ) : (
          <div className="flex flex-col items-start gap-2">
            <p className="text-body-sm text-muted-foreground">{tr('يمكنك إضافة كلمة مرور لتسجيل الدخول بالبريد الإلكتروني أيضًا. هذا اختياري.', 'You can add a password to also sign in with your email. This is optional.')}</p>
            <Button variant="outline" onClick={() => setAdding(true)}>{tr('إضافة كلمة مرور', 'Add a password')}</Button>
          </div>
        )}
      </CardContent>
      <CardFooter className="border-t border-border">
        <AlertDialog defaultOpen={demo === 'signout'}>
          <AlertDialogTrigger asChild><Button variant="outline">{tr('تسجيل الخروج من كل الأجهزة', 'Sign out of all devices')}</Button></AlertDialogTrigger>
          <AlertDialogContent>
            <AlertDialogHeader>
              <AlertDialogTitle>{tr('تسجيل الخروج من كل الأجهزة؟', 'Sign out of all devices?')}</AlertDialogTitle>
              <AlertDialogDescription>{tr('ستحتاج إلى تسجيل الدخول من جديد على كل جهاز، ومنها هذا الجهاز.', 'You’ll need to sign in again on every device, including this one.')}</AlertDialogDescription>
            </AlertDialogHeader>
            <AlertDialogFooter>
              <AlertDialogCancel>{tr('إلغاء', 'Cancel')}</AlertDialogCancel>
              <AlertDialogAction onClick={signOut}>{tr('تسجيل الخروج', 'Sign out')}</AlertDialogAction>
            </AlertDialogFooter>
          </AlertDialogContent>
        </AlertDialog>
      </CardFooter>
    </Card>
  );
}

function SettingsScreen() {
  const [theme, setTheme] = useTheme();
  const user = getUser();
  return (
    <AccountShell current="settings" title={tr('الإعدادات', 'Settings')} theme={theme} setTheme={setTheme}>
      {user && (
        <div className="flex max-w-2xl flex-col gap-6">
          <ProfileCard user={user} />
          <PreferencesCard theme={theme} setTheme={setTheme} />
          <SecurityCard user={user} />
        </div>
      )}
    </AccountShell>
  );
}
ReactDOM.createRoot(document.getElementById('ds-root')).render(<DirectionProvider dir={DIR}><SettingsScreen /></DirectionProvider>);
</script>
</body>
</html>
