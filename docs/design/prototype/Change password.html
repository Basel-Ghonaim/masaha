<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="masaha/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختر كلمة مرور جديدة — مساحة</title>
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/fonts/fonts.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/styles.css">
<link rel="stylesheet" href="masaha/masaha.css">
<script src="masaha/i18n.js"></script>
<script src="_vendor/react.js"></script>
<script src="_vendor/react-dom.js"></script>
<script src="_vendor/babel.min.js"></script>
<script src="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.js"></script>
<script src="masaha/data.js"></script>
<script src="masaha/details-data.js"></script>
</head>
<body class="bg-background text-foreground">
<div id="ds-root"></div>
<script type="text/babel" src="masaha/shared.jsx"></script>
<script type="text/babel" src="masaha/auth.jsx"></script>
<script type="text/babel">
const { DirectionProvider, Button, Card, CardHeader, CardTitle, CardDescription, CardContent, LogOutIcon } = window.MasahaDesignSystem;
// Space owner's first sign-in with a temporary password from the Masaha team. No site navigation until it's changed.
function ForcedChangeScreen() {
  const [theme, setTheme] = useTheme();
  const [pw, setPw] = React.useState(pageParams.get('state') === 'typing' ? 'gaza2026' : '');
  const [error, setError] = React.useState();
  const [submitted, setSubmitted] = React.useState(false);
  const [loading, setLoading] = React.useState(false);
  const submit = (e) => {
    e.preventDefault(); setSubmitted(true);
    if (!pw) return setError(tr('أدخل كلمة المرور الجديدة', 'Enter the new password'));
    if (!passwordOk(pw)) return setError(tr('كلمة المرور لا تستوفي الشروط أدناه', 'The password doesn’t meet the rules below'));
    setError(); setLoading(true);
    setTimeout(() => { handOffToast(tr('حُفظت كلمة المرور الجديدة', 'Your new password is saved')); location.href = carryParams('Home.html?auth=1'); }, 1000);
  };
  return (
    <div className="flex min-h-dvh flex-col bg-background text-foreground">
      <header className="flex h-14 items-center justify-between border-b border-border px-4 md:px-8">
        <span className="text-heading-3 text-primary">{tr('مساحة', 'Masaha')}</span>
        <Button variant="ghost" size="sm" onClick={signOut}><LogOutIcon />{tr('تسجيل الخروج', 'Sign out')}</Button>
      </header>
      <main className="flex flex-1 flex-col px-4 py-6 md:items-center md:justify-center md:px-8 md:py-16">
        <Card className="w-full md:max-w-md">
          <CardHeader>
            <CardTitle>{tr('اختر كلمة مرور جديدة', 'Choose a new password')}</CardTitle>
            <CardDescription>{tr('هذه كلمة مرور مؤقتة من فريق مساحة، اختر كلمة مرور خاصة بك للمتابعة.', 'This is a temporary password from the Masaha team. Choose your own password to continue.')}</CardDescription>
          </CardHeader>
          <CardContent>
            <form onSubmit={submit} noValidate className="flex flex-col gap-4">
              <PasswordField label={tr('كلمة المرور الجديدة', 'New password')} value={pw} onChange={setPw} error={error} disabled={loading} submitted={submitted} />
              <Button type="submit" className="w-full" loading={loading}>{tr('حفظ والمتابعة', 'Save and continue')}</Button>
            </form>
          </CardContent>
        </Card>
      </main>
      <PageToaster />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('ds-root')).render(<DirectionProvider dir={DIR}><ForcedChangeScreen /></DirectionProvider>);
</script>
</body>
</html>
