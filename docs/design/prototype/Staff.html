<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="masaha/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الموظفون — مساحة</title>
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/fonts/fonts.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.css">
<link rel="stylesheet" href="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/styles.css">
<link rel="stylesheet" href="masaha/masaha.css">
<script src="masaha/i18n.js"></script>
<script src="_vendor/react.js"></script>
<script src="_vendor/react-dom.js"></script>
<script src="_vendor/babel.min.js"></script>
<script src="_ds/masaha-design-system-bde31931-75b2-4a5c-a81f-9e2963a5815a/_ds_bundle.js"></script>
<script src="masaha/data.js"></script>
<script src="masaha/details-data.js"></script>
<script src="masaha/owner-data.js"></script>
</head>
<body class="bg-background text-foreground">
<div id="ds-root"></div>
<script type="text/babel" src="masaha/shared.jsx"></script>
<script type="text/babel" src="masaha/owner.jsx"></script>
<script src="masaha/desk-data.js"></script>
<script type="text/babel" src="masaha/desk-core.jsx"></script>
<script type="text/babel" src="masaha/desk-sheet.jsx"></script>
<script type="text/babel">
const { DirectionProvider, Button, Badge, DataTable, EmptyState, Field, Input, RadioGroup, RadioGroupItem, Sheet, SheetContent, SheetHeader, SheetTitle, SheetDescription, SheetBody, SheetFooter, Dialog, DialogContent, DialogHeader, DialogTitle, DialogDescription, DialogFooter, AlertDialog, AlertDialogContent, AlertDialogHeader, AlertDialogTitle, AlertDialogDescription, AlertDialogFooter, AlertDialogCancel, AlertDialogAction, Alert, AlertTitle, AlertDescription, DropdownMenu, DropdownMenuTrigger, DropdownMenuContent, DropdownMenuItem, UsersIcon, EllipsisVerticalIcon, CheckIcon, toast } = window.MasahaDesignSystem;
// OW-018: what the model holds — the link's date (SpaceManager.createdAt), whether access was removed
// (deactivatedAt) and the temporary password not changed yet (User.mustChangePassword).
const INIT = [
  { id: 'st1', name: tr('سامي', 'Sami'), key: DESK.SAMI, email: 'sami@example.com', status: 'active', added: '2026-03-02', pending: false, month: 1380 },
  { id: 'st3', name: tr('ليلى', 'Laila'), key: 'ليلى', email: 'laila@example.com', status: 'active', added: '2026-09-28', pending: true, month: 0 },
  { id: 'st2', name: tr('هالة', 'Hala'), key: 'هالة', email: 'hala@example.com', status: 'removed', added: '2026-05-10', pending: false, month: 0 }
];
const EXISTING = ['nour@example.com', 'sara@example.com'];
const tempPass = () => 'Msh-' + Math.random().toString(36).slice(2, 6) + '-' + (100 + Math.floor(Math.random() * 900));

function StaffPassDialog({ info, onClose }) {
  const { Dialog, DialogContent, DialogHeader, DialogTitle, DialogDescription, DialogFooter, Button, Field, RadioGroup, RadioGroupItem, CheckIcon, toast } = window.MasahaDesignSystem;
  const [copied, setCopied] = React.useState(false);
  const [channel, setChannel] = React.useState('');
  const [err, setErr] = React.useState(null);
  React.useEffect(() => { setCopied(false); setChannel(''); setErr(null); }, [info]);
  const CHANNELS = [['whatsapp', tr('واتساب', 'WhatsApp')], ['in_person', tr('شفهيًا', 'In person')], ['other', tr('أخرى', 'Other')]];
  const done = () => {
    if (!channel) { setErr(tr('اختر طريقة التسليم', 'Choose how it was handed over')); return; }
    toast.success(tr('سُجّلت طريقة التسليم', 'Handover recorded'), { description: info.name + ' · ' + CHANNELS.find(([k]) => k === channel)[1] });
    onClose(channel);
  };
  const keep = (e) => e.preventDefault();
  return (
    <Dialog open={!!info}>
      <DialogContent onEscapeKeyDown={keep} onInteractOutside={keep}>
        <DialogHeader><DialogTitle>{tr('كلمة المرور المؤقتة', 'Temporary password')}</DialogTitle>{info && <DialogDescription>{info.name} · <span dir="ltr">{info.email}</span></DialogDescription>}</DialogHeader>
        {info && <div className="flex flex-col gap-4">
          <div className="flex items-center justify-between gap-3 rounded-lg bg-muted p-3"><span dir="ltr" className="text-heading-3">{info.pw}</span><Button size="sm" variant="outline" onClick={() => { try { navigator.clipboard.writeText(info.pw); } catch (e) {} setCopied(true); }}>{copied ? <><CheckIcon />{tr('نُسخت', 'Copied')}</> : tr('نسخ', 'Copy')}</Button></div>
          <p className="text-body-sm">{tr('سلّمها للموظف؛ سيُطلب منه تغييرها عند أول دخول.', 'Hand it to the staff member; they’ll be asked to change it at first sign-in.')}</p>
          <p className="text-caption text-muted-foreground">{tr('لن تظهر مرة أخرى بعد إغلاق هذه النافذة.', 'It won’t be shown again after you close this window.')}</p>
          <Field label={tr('طريقة التسليم', 'How it was handed over')} error={err}>
            <RadioGroup value={channel} onValueChange={(v) => { setChannel(v); setErr(null); }} className="flex flex-wrap gap-x-6 gap-y-2">
              {CHANNELS.map(([k, l]) => <Field key={k} label={l} orientation="horizontal"><RadioGroupItem value={k} /></Field>)}
            </RadioGroup>
          </Field>
        </div>}
        <DialogFooter className="flex flex-wrap items-center gap-3">
          {!copied && <span className="text-caption text-muted-foreground">{tr('انسخها أولًا — لن تظهر مرة أخرى', 'Copy it first — it won’t be shown again')}</span>}
          <Button disabled={!copied} onClick={done}>{tr('تم', 'Done')}</Button>
        </DialogFooter>
      </DialogContent>
    </Dialog>
  );
}

function StaffInner({ theme, setTheme }) {
  const [list, setList] = React.useState(pageParams.get('state') === 'empty' ? [] : INIT);
  const [add, setAdd] = React.useState(pageParams.get('sheet') === 'add');
  const [name, setName] = React.useState(pageParams.get('email') ? tr('نور', 'Nour') : ''); const [email, setEmail] = React.useState(pageParams.get('email') || ''); const [err, setErr] = React.useState({});
  const { busy, run } = useActionRun('add');
  const [pass, setPass] = React.useState(pageParams.get('pass') ? { name: tr('ليلى', 'Laila'), email: 'laila@example.com', pw: 'Msh-7k2q-418' } : null);
  const [confirm, setConfirm] = React.useState(pageParams.get('stop') ? INIT[0] : null);
  const submit = (e) => {
    e.preventDefault(); const x = {};
    if (!name.trim()) x.name = tr('أدخل الاسم', 'Enter the name');
    if (!/^\S+@\S+\.\S+$/.test(email.trim())) x.email = tr('أدخل بريدًا صحيحًا، مثل name@example.com', 'Enter a valid email, e.g. name@example.com');
    setErr(x); if (Object.keys(x).length) return;
    const e2 = email.trim().toLowerCase();
    if (list.some((s) => s.email === e2 && s.status === 'active')) { setErr({ email: tr('هذا الموظف مضاف مسبقًا', 'This staff member is already added') }); return; }
    run(() => {
      const removed = list.find((s) => s.email === e2 && s.status === 'removed');
      if (removed) {
        setList((l) => l.map((s) => (s.id === removed.id ? { ...s, status: 'active' } : s)));
        setAdd(false); setName(''); setEmail('');
        toast.success(tr(`عاد وصول ${removed.name} إلى Focus Hub`, `${removed.name} has access to Focus Hub again`));
        return;
      }
      if (EXISTING.includes(e2)) {
        setList((l) => [...l, { id: 's' + Date.now(), name: name.trim(), key: name.trim(), email: e2, status: 'active', added: DESK.TODAY, pending: false, month: 0 }]);
        setAdd(false); setName(''); setEmail('');
        toast.success(tr(`رُبط حساب ${e2} بـ Focus Hub`, `${e2}’s account is linked to Focus Hub`));
        return;
      }
      const pw = tempPass();
      setList((l) => [...l, { id: 's' + Date.now(), name: name.trim(), key: name.trim(), email: e2, status: 'active', added: DESK.TODAY, pending: true, month: 0 }]);
      setAdd(false); setName(''); setEmail(''); setPass({ name: name.trim(), email: e2, pw });
    });
  };
  const setStatus = (s, status) => setList((l) => l.map((x) => (x.id === s.id ? { ...x, status } : x)));
  const actions = (s) => (
    <DropdownMenu dir={DIR}>
      <DropdownMenuTrigger asChild><Button variant="ghost" size="icon" aria-label={tr('إجراءات ', 'Actions for ') + s.name}><EllipsisVerticalIcon /></Button></DropdownMenuTrigger>
      <DropdownMenuContent align="end">
        <DropdownMenuItem asChild><a href={'Payments.html?staff=' + encodeURIComponent(s.key)}>{tr('عرض مقبوضاته', 'View collections')}</a></DropdownMenuItem>
        {s.status === 'active' ? <DropdownMenuItem onSelect={() => setConfirm(s)}>{tr('إيقاف الوصول', 'Remove access')}</DropdownMenuItem> : <DropdownMenuItem onSelect={() => setStatus(s, 'active')}>{tr('إعادة الوصول', 'Give access back')}</DropdownMenuItem>}
      </DropdownMenuContent>
    </DropdownMenu>
  );
  const StatusB = ({ s }) => <span className="flex flex-col items-start gap-1"><Badge variant={s.status === 'active' ? 'success' : 'neutral'}>{s.status === 'active' ? tr('نشط', 'Active') : tr('بلا وصول', 'No access')}</Badge>{s.status === 'active' && s.pending && <Badge variant="warning">{tr('لم يغيّر كلمة المرور المؤقتة بعد', 'Hasn’t changed the temporary password yet')}</Badge>}</span>;
  const MonthLink = ({ s }) => <a href={'Payments.html?staff=' + encodeURIComponent(s.key)}><Money n={s.month} /></a>;
  const columns = [
    { id: 'name', header: tr('الاسم', 'Name'), cell: ({ row }) => <span className="flex min-w-0 flex-col"><span className="text-label">{row.original.name}</span><span className="text-caption text-muted-foreground"><Ltr>{row.original.email}</Ltr></span></span> },
    { id: 'status', header: tr('الحالة', 'Status'), cell: ({ row }) => <StatusB s={row.original} /> },
    { id: 'added', header: tr('أُضيف في', 'Added'), cell: ({ row }) => DESK.fmtDate(row.original.added, true) },
    { id: 'month', header: tr('مقبوضاته هذا الشهر', 'Collected this month'), cell: ({ row }) => <MonthLink s={row.original} /> },
    { id: 'act', header: () => <span className="sr-only">{tr('إجراءات', 'Actions')}</span>, cell: ({ row }) => <div className="flex justify-end">{actions(row.original)}</div> }
  ];
  const paged = usePaged(list);
    const addBtn = <Button onClick={() => { setAdd(true); setErr({}); }}>{tr('إضافة موظف', 'Add staff member')}</Button>;
  return (
    <OwnerShell current="staff" title={tr('الموظفون', 'Staff')} state={publicState(DESK.present.length, DESK.capacity)} theme={theme} setTheme={setTheme}>
      <p className="text-body-sm text-muted-foreground">{tr('موظفو الاستقبال يرون المكتب والزبائن والإعلانات ودفعاتهم اليومية فقط، بدون أرقام الدخل.', 'Reception staff see the desk, customers, announcements and their own payments today — no income figures.')}</p>
      <DataTable label={tr('الموظفون', 'Staff')} columns={columns} data={paged.rows} getRowId={(r) => r.id} loading={pageParams.get('state') === 'loading'}
        summary={paged.summary} pagination={paged.nav}
        toolbar={<div className="flex flex-wrap items-center justify-between gap-3">
          <ResultCount>{tr('عدد الموظفين', 'Staff')}: <Num>{list.length}</Num></ResultCount>
          {addBtn}
        </div>}
        renderCard={(s) => (
          <div className="flex items-start justify-between gap-3">
            <div className="flex min-w-0 flex-col gap-1">
              <span className="text-label">{s.name}</span>
              <span className="text-caption text-muted-foreground"><Ltr>{s.email}</Ltr></span>
              <span className="text-caption text-muted-foreground">{tr('أُضيف في', 'Added')} {DESK.fmtDate(s.added, true)}</span>
              <StatusB s={s} />
              <span className="text-caption">{tr('هذا الشهر', 'This month')} <MonthLink s={s} /></span>
            </div>
            {actions(s)}
          </div>
        )}
        empty={<EmptyState icon={<UsersIcon />} title={tr('لا يوجد موظفون', 'No staff yet')} description={tr('يمكنك إدارة المكتب بنفسك أو إضافة موظف استقبال.', 'You can run the desk yourself or add a reception staff member.')}>{addBtn}</EmptyState>} />
      <Sheet open={add} onOpenChange={setAdd}>
        <SheetContent side="end" closeLabel={tr('إغلاق', 'Close')}>
          <SheetHeader><SheetTitle>{tr('إضافة موظف', 'Add staff member')}</SheetTitle><SheetDescription>{tr('الدور: الاستقبال', 'Role: Reception')}</SheetDescription></SheetHeader>
          <form onSubmit={submit} noValidate className="flex min-h-0 flex-1 flex-col">
            <SheetBody className="flex flex-col gap-5 py-2">
              <RateLimitNote />
              <ActionAlert for="add" />
              <Field label={tr('الاسم', 'Name')} error={err.name}><Input value={name} onChange={(e) => setName(e.target.value)} /></Field>
              <Field label={tr('البريد الإلكتروني', 'Email')} error={err.email}><Input type="email" dir="ltr" placeholder="name@example.com" value={email} onChange={(e) => setEmail(e.target.value)} /></Field>
              <p className="text-body-sm text-muted-foreground">{tr('إن كان للبريد حساب في مساحة يُربط به ويدخل بكلمة مروره؛ وإلا يُنشأ حساب برمز مرور مؤقت يظهر لك مرة واحدة.', 'If the email has a Masaha account, it is linked and signs in with its own password; otherwise an account is created with a temporary password shown to you once.')}</p>
            </SheetBody>
            <SheetFooter><Button type="submit" className="w-full" loading={busy}>{tr('إضافة إلى الاستقبال', 'Add to reception')}</Button></SheetFooter>
          </form>
        </SheetContent>
      </Sheet>
      <StaffPassDialog info={pass} onClose={() => setPass(null)} />
      <AlertDialog open={!!confirm} onOpenChange={(o) => !o && setConfirm(null)}>
        <AlertDialogContent>
          <AlertDialogHeader><AlertDialogTitle>{tr('إيقاف وصول ', 'Remove ')}{confirm && confirm.name}{tr('؟', '’s access?')}</AlertDialogTitle><AlertDialogDescription>{confirm && tr(`تنتهي كل جلسات ${confirm.name} على كل الأجهزة الآن، ويتوقف الوصول إلى Focus Hub. يبقى الاسم على الدفعات وفي السجل، ويمكنك إعادة الوصول لاحقًا.`, `${confirm.name} is signed out on every device now and can no longer reach Focus Hub. The name stays on the payments and in the log, and you can give the access back later.`)}</AlertDialogDescription></AlertDialogHeader>
          <AlertDialogFooter><AlertDialogCancel>{tr('رجوع', 'Back')}</AlertDialogCancel><AlertDialogAction variant="destructive" onClick={() => setStatus(confirm, 'removed')}>{tr('إيقاف الوصول', 'Remove access')}</AlertDialogAction></AlertDialogFooter>
        </AlertDialogContent>
      </AlertDialog>
    </OwnerShell>
  );
}

function Screen() { const [theme, setTheme] = useTheme(); return <DeskProvider><StaffInner theme={theme} setTheme={setTheme} /></DeskProvider>; }
ReactDOM.createRoot(document.getElementById('ds-root')).render(<DirectionProvider dir={DIR}><Screen /></DirectionProvider>);
</script>
</body>
</html>
